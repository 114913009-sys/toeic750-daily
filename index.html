 have your drafts ready by Friday so that we can finalize everything before the launch.\n\nThanks,\nPaula"},"g7":{"kind":"Article","title":"Brightway Foods Sees Record Sales","text":"MILFORD — Brightway Foods reported record sales for the third quarter, driven largely by the success of its new line of frozen meals. The company credits an online video campaign that featured customers sharing their own recipes. \"The response was far beyond what we expected,\" said marketing director Alan Price.\n\nBrightway now plans to introduce the frozen line in grocery stores in Canada early next year. To meet the increased demand, the company will also hire 50 additional workers at its Milford factory."}},"questions":[{"part":"P2","prompt":"Where should we place the ads for the new energy drink?","options":["Online, mostly on social media platforms.","About two thousand dollars.","Yes, I placed the order."],"answer":0,"explanation":"Where 問地點或管道，回答「網路、社群平台」最適當。第二個選項回答金額；Wh- 問句不能用 Yes 回答，且 placed 是同字陷阱。","vocab":[["place an ad","刊登廣告"],["platform","平台"]]},{"part":"P2","prompt":"The focus group results came in this morning.","options":["We focused on quality.","What did the participants think?","In the morning meeting room."],"answer":1,"explanation":"陳述句常用「追問」來回應，問參與者的看法最自然。focused 與 morning 都是重複題目字詞的陷阱。","vocab":[["focus group","焦點團體（市調）"],["participant","參與者"]]},{"part":"P5","stem":"The advertising campaign was so ______ that sales doubled within a month.","options":["success","successful","successfully","succeed"],"answer":1,"explanation":"so + 形容詞 + that（如此…以至於），be 動詞後接形容詞 successful。","vocab":[["campaign","活動；宣傳"],["double","加倍"]]},{"part":"P5","stem":"Ms. Rivera, ______ designed the new logo, will present it at Monday's meeting.","options":["who","which","whom","whose"],"answer":0,"explanation":"先行詞是人（Ms. Rivera），空格後直接接動詞 designed，需要主格關係代名詞 who。","vocab":[["design","設計"],["present","發表"]]},{"part":"P5","stem":"Please review the attached brochure and send any comments to me ______ Wednesday.","options":["as soon as","in case","no later than","as long as"],"answer":2,"explanation":"no later than + 時間 = 最晚在某時之前，後面接名詞 Wednesday。其他三個是連接詞，後面要接子句。","vocab":[["attached","附加的"],["brochure","小冊子"]]},{"part":"P5","stem":"The company plans to ______ its market share in Southeast Asia next year.","options":["extend","exceed","expose","expand"],"answer":3,"explanation":"expand market share（擴大市占率）是固定搭配。extend 多用於延長期限，exceed 是超過，expose 是暴露。","vocab":[["market share","市占率"],["expand","擴大"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["launches","launch","launched","launching"],"answer":1,"explanation":"助動詞 will 後面接原形動詞 launch。","vocab":[["prime time","黃金時段"],["air","播出"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Our office will be closed for the holidays.","The magazine was founded in 1985.","Thank you for your recent purchase.","Each of you is responsible for preparing the social media posts for your region."],"answer":3,"explanation":"下一句要大家「週五前準備好草稿」，空格應先說明每個人要準備什麼，所以選社群貼文的分工句。其他句子與活動準備無關。","vocab":[["be responsible for","負責"],["finalize","定案"]],"group":"g6"},{"part":"P7","stem":"What is the article mainly about?","options":["A new grocery store opening","A change in company leadership","A company's successful product line","A cooking competition"],"answer":2,"explanation":"第一句就說 Brightway 因冷凍餐新產品線創下銷售紀錄，主旨是成功的產品線。","vocab":[["record sales","創紀錄的銷售"],["credit A to B","把 A 歸功於 B"]],"group":"g7"},{"part":"P7","stem":"What does Brightway Foods plan to do?","options":["Close its Milford factory","Sell its products in another country","Stop its online advertising","Reduce its number of employees"],"answer":1,"explanation":"原文說明年初要在加拿大的超市推出冷凍產品線，改寫成「在另一個國家販售」。公司其實要增聘 50 人，不是裁員。","vocab":[["introduce","推出"],["demand","需求"]],"group":"g7"}]},{"topic":"主題：客服與客訴","passages":{"g6":{"kind":"Letter","title":"To: Ms. Helen Ward / From: Torres Appliances Customer Care / Subject: Your recent inquiry","text":"Dear Ms. Ward,\n\nThank you for contacting Torres Appliances about the problem with your dishwasher. We are sorry to hear that it stopped working only two months after [7].\n\nBecause your dishwasher is still under warranty, a technician will visit your home to repair it at no cost. [8] Simply call 555-0144 and choose a time that is convenient for you.\n\nSincerely,\nMark Delgado"},"g7":{"kind":"Notice","title":"Riverside Internet: Customer Service Update","text":"Starting June 1, our customer service phone line will be open from 7:00 A.M. to 11:00 P.M. daily, two hours longer than before.\n\nFor simple questions, such as checking your bill or changing your password, try our new online chat service, available 24 hours a day at riversidenet.com/help. Customers who use the chat service before July 1 will be entered into a drawing to win a free year of service."}},"questions":[{"part":"P2","prompt":"How long will it take to repair my laptop?","options":["About three business days.","Yes, it was quite expensive.","At the service counter."],"answer":0,"explanation":"How long 問「多久」，回答一段時間。最後一個選項回答地點，Yes 不能回答 Wh- 問句。","vocab":[["repair","修理"],["business day","工作天"]]},{"part":"P2","prompt":"Could you transfer me to the billing department?","options":["The bill was paid yesterday.","Certainly. Please hold for a moment.","I transferred last year."],"answer":1,"explanation":"這是請求轉接電話，回答「好的，請稍候」最自然。bill 與 billing 是相似字陷阱，transferred 是同字陷阱。","vocab":[["transfer","轉接"],["billing department","帳務部門"],["hold","（電話）稍候"]]},{"part":"P5","stem":"Customers can ______ a refund within 30 days of purchase.","options":["require","request","respond","reply"],"answer":1,"explanation":"request a refund（要求退款）是固定搭配。require 是規定或需要，respond 和 reply 後面要接 to。","vocab":[["refund","退款"],["purchase","購買"]]},{"part":"P5","stem":"If the item ______ damaged during shipping, we will replace it free of charge.","options":["will be","being","is","was"],"answer":2,"explanation":"條件句的 if 子句用現在式表示未來，主要子句才用 will，所以用 is。","vocab":[["shipping","運送"],["free of charge","免費"]]},{"part":"P5","stem":"Our representatives are available ______ the clock to answer your questions.","options":["along","across","among","around"],"answer":3,"explanation":"around the clock 是「全天候、24 小時」的慣用語。","vocab":[["representative","（客服）代表"],["around the clock","全天候"]]},{"part":"P5","stem":"We apologize for the delay and appreciate your ______ in this matter.","options":["patient","patiently","patience","patients"],"answer":2,"explanation":"所有格 your 後面要接名詞，patience 是「耐心」。patients 雖然也是名詞，但意思是「病人」。","vocab":[["apologize for","為…道歉"],["patience","耐心"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["install","installed","installation","installer"],"answer":2,"explanation":"介系詞 after 後面接名詞，installation 是「安裝」，語意也最合理。","vocab":[["dishwasher","洗碗機"],["installation","安裝"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["We will need to schedule the visit in advance.","Our new refrigerator models are now on sale.","The warranty period has already ended.","We have moved our headquarters to Chicago."],"answer":0,"explanation":"前一句說技術人員會到府維修，下一句說打電話選時間，中間補「需要事先安排時間」最連貫。保固已過期與前文矛盾。","vocab":[["warranty","保固"],["technician","技術人員"]],"group":"g6"},{"part":"P7","stem":"What is being announced?","options":["Lower monthly prices","Longer customer service hours","A new office location","A change in internet speed"],"answer":1,"explanation":"第一段說客服電話時間延長兩小時，所以是客服時間變長。","vocab":[["daily","每天"],["drawing","抽獎"]],"group":"g7"},{"part":"P7","stem":"How can customers enter a drawing?","options":["By calling before 7:00 A.M.","By changing their password","By using the online chat before July 1","By paying their bill early"],"answer":2,"explanation":"原文說 7 月 1 日前使用線上客服的顧客可以參加抽獎。改密碼只是線上客服能處理的例子之一。","vocab":[["enter","參加"],["password","密碼"]],"group":"g7"}]},{"topic":"主題：物流與倉儲","passages":{"g6":{"kind":"Memo","title":"To: Warehouse Staff / From: Operations Manager / Subject: New Inventory Scanners","text":"Starting next Monday, all warehouse staff will use new handheld scanners to record incoming and outgoing goods. The scanners are faster and [7] more accurate than the ones we use now.\n\nA training session will be held on Friday at 2:00 P.M. in the break room. [8] If you cannot attend, please speak with your supervisor."},"g7":{"kind":"E-mail","title":"To: Sam Lee / From: QuickShip Logistics / Subject: Delivery Update","text":"Dear Mr. Lee,\n\nYour order #55921 was scheduled to arrive on Tuesday. However, due to a snowstorm in the Denver area, all deliveries in the region have been postponed by one day. Your package is now expected on Wednesday between 9:00 A.M. and 1:00 P.M.\n\nIf no one will be available to receive it, you may choose to pick it up at our Elm Street location after 3:00 P.M. on Thursday. We apologize for the inconvenience."}},"questions":[{"part":"P2","prompt":"Has the shipment from Rotterdam cleared customs yet?","options":["It's being inspected right now.","The customers were very satisfied.","I'll clear the table."],"answer":0,"explanation":"問貨物是否已通關，回答「正在檢查中」最合理。customers 與 customs 音近，clear 是同字陷阱。","vocab":[["clear customs","通關"],["inspect","檢查"]]},{"part":"P2","prompt":"Which warehouse should these boxes go to?","options":["They were delivered by truck.","The one on Harbor Road.","Yes, they're quite heavy."],"answer":1,"explanation":"Which warehouse 問哪一個倉庫，用 The one on... 回答。第一個選項回答運送方式。","vocab":[["warehouse","倉庫"]]},{"part":"P5","stem":"All packages must be labeled ______ before they leave the warehouse.","options":["correct","correctly","correction","corrected"],"answer":1,"explanation":"修飾動詞 labeled 要用副詞 correctly。","vocab":[["label","貼標籤"],["package","包裹"]]},{"part":"P5","stem":"The delivery was delayed ______ a shortage of drivers.","options":["even though","so that","because of","in order to"],"answer":2,"explanation":"空格後是名詞片語 a shortage of drivers，要用介系詞片語 because of。even though 和 so that 要接子句，in order to 接動詞。","vocab":[["shortage","短缺"],["delay","延誤"]]},{"part":"P5","stem":"Neither the drivers nor the supervisor ______ aware of the schedule change.","options":["were","was","being","been"],"answer":1,"explanation":"Neither A nor B 的動詞和靠近的 B 一致，supervisor 是單數，所以用 was。","vocab":[["supervisor","主管"],["be aware of","知道"]]},{"part":"P5","stem":"The new tracking system allows customers to ______ the status of their orders online.","options":["monitoring","monitored","monitors","monitor"],"answer":3,"explanation":"allow + 受詞 + to + 原形動詞，所以用 monitor。","vocab":[["tracking system","追蹤系統"],["status","狀態"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["very","many","much","more"],"answer":2,"explanation":"修飾比較級 more accurate 要用 much（遠比…）。very 不能修飾比較級。","vocab":[["handheld","手持式的"],["accurate","準確的"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Attendance is required for all staff members.","The break room will be painted next month.","Our company was founded thirty years ago.","Thank you for your order."],"answer":0,"explanation":"下一句說「如果不能參加請找主管」，代表訓練是必須參加的，所以選「全員必須出席」。","vocab":[["attendance","出席"],["required","必須的"]],"group":"g6"},{"part":"P7","stem":"Why was the delivery delayed?","options":["The address was incorrect","A shortage of packages","A problem with payment","Bad weather in the area"],"answer":3,"explanation":"原文說 due to a snowstorm，暴風雪改寫成 bad weather。","vocab":[["postpone","延後"],["snowstorm","暴風雪"]],"group":"g7"},{"part":"P7","stem":"What option is offered to Mr. Lee?","options":["Collecting the package himself","Receiving a full refund","Changing the delivery address","Getting free shipping"],"answer":0,"explanation":"第二段說沒人收件時，可以到 Elm Street 據點自取，pick it up 改寫成 collecting the package himself。","vocab":[["pick up","領取"],["inconvenience","不便"]],"group":"g7"}]},{"topic":"主題：財務與會計","passages":{"g6":{"kind":"Memo","title":"To: All Employees / From: Accounting Department / Subject: Payroll System Update","text":"Please note that our payroll system will be upgraded on the weekend of May 15. As a result, the online payroll portal will be [7] from Friday evening until Monday morning.\n\nPaychecks will not be affected by this upgrade. [8] If you have any questions, please contact Linda Shaw in the accounting department."},"g7":{"kind":"Text message","title":"Raj Patel and Mia Torres","text":"Raj Patel (10:12 A.M.): Hi Mia, the client in Osaka still hasn't paid the invoice from March. It's now 45 days overdue.\nMia Torres (10:15 A.M.): That's unusual for them. Did you send a reminder?\nRaj Patel (10:16 A.M.): Twice, but I haven't heard back.\nMia Torres (10:18 A.M.): I'll call their finance manager this afternoon. I met her at the trade fair last year.\nRaj Patel (10:19 A.M.): Great, thanks. Let me know what she says."}},"questions":[{"part":"P2","prompt":"Do you want me to e-mail you the invoice or print it?","options":["A printed copy would be better.","Yes, I received it.","The price is reasonable."],"answer":0,"explanation":"選擇疑問句（A or B）要從兩者中選一個，「紙本比較好」直接回答。選擇疑問句通常不用 Yes/No。","vocab":[["invoice","發票；請款單"],["printed copy","紙本"]]},{"part":"P2","prompt":"Why is the accounting office closed today?","options":["On the third floor.","Yes, I'll close the window.","They're attending a tax seminar."],"answer":2,"explanation":"Why 問原因，「他們去參加稅務研討會」說明了原因。close 是同字陷阱。","vocab":[["accounting","會計"],["seminar","研討會"]]},{"part":"P5","stem":"The quarterly report shows that expenses rose ______ 12 percent last year.","options":["at","by","on","with"],"answer":1,"explanation":"rise by + 百分比表示「增加了多少」。","vocab":[["quarterly report","季報"],["expense","支出"]]},{"part":"P5","stem":"Ms. Kim ______ as chief financial officer since 2019.","options":["served","serves","has served","will serve"],"answer":2,"explanation":"since + 過去時間點，主要子句用現在完成式 has served。","vocab":[["serve as","擔任"],["chief financial officer","財務長"]]},{"part":"P5","stem":"Expense claims that are not ______ by a manager will not be processed.","options":["approved","approving","approval","approve"],"answer":0,"explanation":"be 動詞 + p.p. 構成被動語態，費用申請「被」主管核准。","vocab":[["expense claim","費用申請"],["process","處理"]]},{"part":"P5","stem":"The company's profits were lower than expected, ______ investors remained optimistic.","options":["despite","because","unless","yet"],"answer":3,"explanation":"前後語意轉折（獲利低，投資人仍樂觀），而且空格後是子句，要用對等連接詞 yet。despite 是介系詞，不能接子句。","vocab":[["profit","利潤"],["optimistic","樂觀的"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["uncertain","unavailable","unaffordable","unaware"],"answer":1,"explanation":"系統升級期間，網站「無法使用」，所以用 unavailable。","vocab":[["payroll","薪資"],["portal","入口網站"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Our new office opened last week.","Please return your laptops by Friday.","Salaries will be deposited on the usual date.","The seminar was very informative."],"answer":2,"explanation":"前一句說薪資不受影響，接著補充「薪水照常入帳」最連貫。","vocab":[["deposit","存入"],["salary","薪水"]],"group":"g6"},{"part":"P7","stem":"What problem does Mr. Patel mention?","options":["A client has not made a payment","An invoice contains an error","A trade fair was canceled","A shipment was lost"],"answer":0,"explanation":"第一則訊息說大阪的客戶還沒付三月的款項，已逾期 45 天。","vocab":[["overdue","逾期的"],["reminder","提醒（通知）"]],"group":"g7"},{"part":"P7","stem":"What will Ms. Torres most likely do this afternoon?","options":["Send another e-mail reminder","Travel to Osaka","Telephone someone she knows","Prepare a new invoice"],"answer":2,"explanation":"她說下午會打給對方的財務經理，而且去年在展覽上見過她，所以是打電話給認識的人。","vocab":[["finance manager","財務經理"],["trade fair","商展"]],"group":"g7"}]},{"topic":"主題：餐廳與餐飲","passages":{"g6":{"kind":"E-mail","title":"To: Event Guests / From: Bella Cucina Catering / Subject: Your Menu Selection","text":"Thank you for choosing Bella Cucina to cater your company's anniversary dinner. We have attached a list of menu options for your [7].\n\nPlease select one appetizer, two main courses, and one dessert. [8] Final selections must be received by October 10 so that our kitchen staff can order ingredients in time."},"g7":{"kind":"Advertisement","title":"Harvest Table: Now Open in Downtown Fairview","text":"Harvest Table brings farm-fresh cooking to downtown Fairview. Our menu changes every season and features ingredients from local farms within 50 miles of the city. We are open for lunch Tuesday through Sunday and for dinner Thursday through Saturday.\n\nDuring our opening month, all guests who present this advertisement will receive a free appetizer. Private dining rooms are available for parties of up to 20 people; reservations for these must be made at least one week ahead."}},"questions":[{"part":"P2","prompt":"Can I see the dessert menu, please?","options":["Sure, I'll bring it right over.","The desert is very hot.","I'll have the steak."],"answer":0,"explanation":"顧客請求看甜點菜單，服務生回答馬上拿來。desert（沙漠）和 dessert 是相似音陷阱。","vocab":[["dessert","甜點"],["bring over","拿過來"]]},{"part":"P2","prompt":"What time does the restaurant start serving dinner?","options":["About twenty people.","Starting at five thirty.","Yes, I'd like a table."],"answer":1,"explanation":"What time 問時間，回答五點半開始。","vocab":[["serve","供應（餐點）"]]},{"part":"P5","stem":"Reservations are ______ recommended for groups of eight or more.","options":["strong","strongly","strength","stronger"],"answer":1,"explanation":"修飾過去分詞 recommended 要用副詞 strongly。strongly recommended 是常見搭配。","vocab":[["reservation","訂位"],["recommend","建議"]]},{"part":"P5","stem":"The chef, ______ recipes have won several awards, will open a second restaurant.","options":["who","which","that","whose"],"answer":3,"explanation":"空格後接名詞 recipes，表示「主廚的食譜」，要用所有格關係代名詞 whose。","vocab":[["recipe","食譜"],["award","獎項"]]},{"part":"P5","stem":"Diners are asked to inform their server of any food allergies ______ ordering.","options":["until","before","within","unless"],"answer":1,"explanation":"點餐「之前」告知過敏，before + V-ing。until 表示持續到某時，語意不合。","vocab":[["inform A of B","告知 A 某事"],["allergy","過敏"]]},{"part":"P5","stem":"Due to rising food costs, the restaurant has decided to ______ its menu prices slightly.","options":["rise","arise","raise","rose"],"answer":2,"explanation":"後面有受詞 its menu prices，要用及物動詞 raise（提高）。rise 和 arise 是不及物動詞。","vocab":[["raise","提高"],["slightly","稍微"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["consider","considerate","consideration","considerably"],"answer":2,"explanation":"所有格 your 後面要接名詞，for your consideration 是「供您參考」的固定說法。","vocab":[["cater","承辦餐飲"],["anniversary","週年"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Vegetarian and gluten-free dishes are also available upon request.","Our restaurant is closed on Mondays.","The dinner was a great success.","We have recently hired a new accountant."],"answer":0,"explanation":"前一句說明怎麼選菜，接著補充「也可依需求提供素食和無麩質餐」最連貫。晚宴還沒舉行，不能說已經很成功。","vocab":[["upon request","依要求"],["ingredient","食材"]],"group":"g6"},{"part":"P7","stem":"What is mentioned about the menu?","options":["It is the same all year.","It changes with the seasons.","It offers only vegetarian dishes.","It is available only online."],"answer":1,"explanation":"原文說 Our menu changes every season，菜單每季更換。","vocab":[["farm-fresh","產地直送的"],["feature","以…為特色"]],"group":"g7"},{"part":"P7","stem":"How can customers receive a free appetizer?","options":["By reserving a private room","By visiting on a Monday","By showing the advertisement","By ordering for 20 people"],"answer":2,"explanation":"開幕月出示這則廣告就能獲得免費前菜，present 改寫成 showing。","vocab":[["appetizer","前菜"],["present","出示"]],"group":"g7"}]},{"topic":"主題：IT 與軟體導入","passages":{"g6":{"kind":"Memo","title":"To: All Staff / From: IT Department / Subject: Switching to CloudDesk","text":"Beginning July 1, our company will switch from our current e-mail program to CloudDesk, a web-based platform that combines e-mail, file sharing, and video meetings. [7], employees will be able to access their accounts from any device.\n\nAll your existing messages will be transferred automatically. [8]"},"g7":{"kind":"Notice","title":"CloudDesk Training Workshops","text":"To help staff become comfortable with the new CloudDesk system, the IT department will offer one-hour training workshops throughout the month of July. Morning sessions start at 9:00 A.M. and afternoon sessions at 3:00 P.M.\n\nSpace is limited to 15 participants per session, so please register through the company intranet. Employees who cannot attend in person may watch a recorded version of the workshop, which will be posted on the intranet by July 5."}},"questions":[{"part":"P2","prompt":"Why isn't the printer on the second floor working?","options":["On the second floor.","It's out of toner.","Yes, it works part-time."],"answer":1,"explanation":"Why 問原因，「碳粉用完了」說明了原因。第一個選項重複題目，works 是同字陷阱。","vocab":[["toner","碳粉"],["out of","用完"]]},{"part":"P2","prompt":"Shouldn't we back up the files before the system upgrade?","options":["The upgrade costs extra.","Back to the office.","Yes, I'll do that this afternoon."],"answer":2,"explanation":"否定疑問句其實是在提建議，回答「好，我下午做」最自然。back 是同字陷阱。","vocab":[["back up","備份"],["upgrade","升級"]]},{"part":"P5","stem":"Employees are reminded to change their passwords ______ every three months.","options":["at least","at most","at last","at once"],"answer":0,"explanation":"at least every three months（至少每三個月一次）語意最合理。at last 是終於，at once 是立刻。","vocab":[["remind","提醒"],["at least","至少"]]},{"part":"P5","stem":"The IT department is currently ______ a new security system across all branches.","options":["implement","implemented","implementing","implementation"],"answer":2,"explanation":"is + V-ing 是現在進行式，配合 currently，用 implementing。","vocab":[["implement","實施；導入"],["branch","分公司"]]},{"part":"P5","stem":"Once the software ______, all users will be able to access the shared calendar.","options":["installs","is installed","will install","installing"],"answer":1,"explanation":"軟體是「被」安裝，用被動；once 引導的時間子句用現在式代替未來式，所以是 is installed。","vocab":[["once","一旦"],["access","使用；存取"]]},{"part":"P5","stem":"Please contact the help desk ______ you experience any technical difficulties.","options":["unless","although","whereas","if"],"answer":3,"explanation":"「如果」遇到技術問題就聯絡客服，用 if。unless 是除非，語意相反。","vocab":[["help desk","服務台"],["technical difficulty","技術問題"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["However","As a result","Otherwise","In contrast"],"answer":1,"explanation":"因為改用網頁平台，「結果」可以從任何裝置登入，前後是因果關係，用 As a result。","vocab":[["web-based","網頁式的"],["combine","結合"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Please print all your e-mails before June 30.","You do not need to take any action to keep them.","Our video meetings were canceled.","The new laptops will arrive next year."],"answer":1,"explanation":"前一句說舊郵件會自動轉移，接著說「你不需要做任何事」最合理。要大家列印郵件與自動轉移矛盾。","vocab":[["existing","現有的"],["automatically","自動地"]],"group":"g6"},{"part":"P7","stem":"What is the purpose of the workshops?","options":["To help staff learn a new software system","To recruit new IT staff","To explain changes to working hours","To train managers in leadership"],"answer":0,"explanation":"第一句說工作坊是為了讓員工熟悉新的 CloudDesk 系統。","vocab":[["workshop","工作坊"],["comfortable with","熟悉"]],"group":"g7"},{"part":"P7","stem":"What is indicated about employees who cannot attend?","options":["They must register for August.","They can view a recording.","They should contact a manager.","They will receive a printed guide."],"answer":1,"explanation":"原文說無法到場的人可以看錄影版，recorded version 改寫成 recording。","vocab":[["in person","親自"],["intranet","公司內網"]],"group":"g7"}]},{"topic":"主題：製造與品管","passages":{"g6":{"kind":"Memo","title":"To: Production Staff / From: Plant Manager / Subject: Machine Maintenance","text":"The packaging machines on Line 3 will be shut down for scheduled maintenance on Saturday. During this time, all packaging work will be [7] to Line 4.\n\n[8] Staff normally assigned to Line 3 should report to Line 4 at the usual start time. Thank you for your flexibility."},"g7":{"kind":"Article","title":"Ferro Motors Recalls 12,000 Vehicles","text":"DETROIT — Ferro Motors announced on Tuesday that it is recalling about 12,000 of its Strada sedans manufactured between January and March of this year. The company discovered that a faulty part in the braking system may wear out sooner than expected. No accidents have been reported.\n\nOwners will receive a letter by mail and can have the part replaced free of charge at any authorized dealer. Ferro Motors said the supplier of the part has already corrected the problem."}},"questions":[{"part":"P2","prompt":"When will the new assembly line be operational?","options":["In the factory in Ohio.","By the end of next month.","Yes, it's a long line."],"answer":1,"explanation":"When 問時間，回答「下個月底前」。第一個選項回答地點，line 是同字陷阱。","vocab":[["assembly line","生產線"],["operational","運作中的"]]},{"part":"P2","prompt":"The inspection found several defects in the last batch.","options":["Then we'll need to stop production.","I'll inspect your car tomorrow.","A batch of cookies."],"answer":0,"explanation":"陳述句說檢查發現瑕疵，回應「那得停產」是合理的反應。inspect、batch 都是重複字陷阱。","vocab":[["defect","瑕疵"],["batch","一批"]]},{"part":"P5","stem":"Every product is ______ tested before it leaves our facility.","options":["thorough","thoroughly","thoroughness","more thorough"],"answer":1,"explanation":"修飾過去分詞 tested 要用副詞 thoroughly（徹底地）。","vocab":[["facility","設施；廠房"],["thoroughly","徹底地"]]},{"part":"P5","stem":"The factory has reduced its energy use by 20 percent ______ installing solar panels.","options":["for","with","by","from"],"answer":2,"explanation":"by + V-ing 表示「藉由某方法」。","vocab":[["reduce","減少"],["solar panel","太陽能板"]]},{"part":"P5","stem":"Workers must wear safety goggles ______ operating the cutting machines.","options":["during","unless","despite","while"],"answer":3,"explanation":"while + V-ing 表示「在做某事的時候」。during 是介系詞，後面接名詞，不接 V-ing 片語。","vocab":[["safety goggles","護目鏡"],["operate","操作"]]},{"part":"P5","stem":"The defective parts ______ by the supplier at no additional cost.","options":["replaced","were replacing","will be replaced","will replace"],"answer":2,"explanation":"零件是「被」供應商更換，後面有 by，要用被動語態 will be replaced。","vocab":[["defective","有瑕疵的"],["supplier","供應商"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["removed","delayed","reduced","transferred"],"answer":3,"explanation":"be transferred to + 地點表示「被轉移到」，包裝工作移到四號線。","vocab":[["shut down","停機"],["scheduled maintenance","定期保養"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The maintenance is expected to be finished by Sunday evening.","Our cafeteria now serves breakfast.","The packaging machines were sold last month.","Please submit your vacation requests online."],"answer":0,"explanation":"本文在說明保養安排，補充「預計週日晚上完成」最連貫。機器若已賣掉就不需要保養。","vocab":[["be assigned to","被分派到"],["flexibility","彈性；配合"]],"group":"g6"},{"part":"P7","stem":"Why is the company recalling vehicles?","options":["Several accidents were reported.","A part may wear out too quickly.","The vehicles were too expensive.","The engines use too much fuel."],"answer":1,"explanation":"原文說煞車系統的零件可能比預期更早磨損。文中明說沒有事故發生。","vocab":[["recall","召回"],["wear out","磨損"]],"group":"g7"},{"part":"P7","stem":"What is stated about the repairs?","options":["They will cost owners a small fee.","They must be done in Detroit.","They will be provided at no cost.","They will take several weeks."],"answer":2,"explanation":"原文 free of charge 改寫成 at no cost，可在任何授權經銷商免費更換。","vocab":[["authorized dealer","授權經銷商"],["faulty","有缺陷的"]],"group":"g7"}]},{"topic":"主題：房地產與租賃","passages":{"g6":{"kind":"Letter","title":"To: Mr. David Chen / From: Oakwood Property Management / Subject: Lease Renewal","text":"Dear Mr. Chen,\n\nYour current lease for Unit 4B will expire on December 31. We would be happy to [7] it for another year.\n\nThe new monthly rent will be $1,450, an increase of $50. [8] Please sign and return the enclosed renewal form by November 30 if you wish to stay.\n\nSincerely,\nGrace Lin, Property Manager"},"g7":{"kind":"Advertisement","title":"Office Space for Lease: Riverside Tower","text":"Riverside Tower offers modern office suites ranging from 800 to 5,000 square feet. The building features a fitness center, a rooftop garden, and 24-hour security. Tenants enjoy free use of three shared conference rooms, which can be reserved online. Underground parking is available for an additional monthly fee.\n\nBusinesses that sign a lease of three years or longer before March 31 will receive the first two months rent-free. To arrange a tour, call Jason Park at 555-0170."}},"questions":[{"part":"P2","prompt":"Is the apartment on Maple Street still available?","options":["No, it was rented last week.","On the corner of Maple and Fifth.","I'm available on Tuesday."],"answer":0,"explanation":"問公寓是否還有空房，回答「沒有，上週租出去了」。第三個選項的 available 是同字陷阱，意思變成「有空」。","vocab":[["available","可租用的；有空的"],["rent","出租"]]},{"part":"P2","prompt":"How much is the monthly rent for the office space?","options":["For about two years.","It's twenty-five hundred dollars.","Yes, I'd like to rent it."],"answer":1,"explanation":"How much 問價錢，回答金額。第一個選項回答期間。","vocab":[["monthly rent","月租"]]},{"part":"P5","stem":"The lease ______ that tenants are responsible for minor repairs.","options":["stating","statement","states","stately"],"answer":2,"explanation":"主詞 The lease 後面缺動詞，而且是第三人稱單數，用 states（載明）。","vocab":[["lease","租約"],["tenant","房客"]]},{"part":"P5","stem":"The new office building is ______ located near the subway station.","options":["convenient","conveniently","convenience","more convenient"],"answer":1,"explanation":"修飾過去分詞 located 要用副詞，conveniently located 是「位置便利」的常見搭配。","vocab":[["be located","位於"]]},{"part":"P5","stem":"Tenants must give ______ notice at least 60 days before moving out.","options":["write","written","writing","writer"],"answer":1,"explanation":"written notice（書面通知）是固定說法，過去分詞當形容詞修飾 notice。","vocab":[["notice","通知"],["move out","搬出"]]},{"part":"P5","stem":"The property was sold ______ a price higher than the original asking price.","options":["on","in","of","at"],"answer":3,"explanation":"at a price（以某價格）是固定搭配。","vocab":[["property","房產"],["asking price","開價"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["renew","renewal","renewed","renewing"],"answer":0,"explanation":"be happy to + 原形動詞，所以用 renew（續約）。","vocab":[["expire","到期"],["renew","續約"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Your unit was cleaned before you moved in.","We are hiring new security guards.","This reflects the recent rise in maintenance costs.","Parking is not permitted on the street."],"answer":2,"explanation":"前一句說租金漲 50 元，接著說明漲價原因最合理。This 指的就是漲價這件事。","vocab":[["reflect","反映"],["enclosed","隨函附上的"]],"group":"g6"},{"part":"P7","stem":"What is NOT mentioned as a feature of the building?","options":["A fitness center","A rooftop garden","A restaurant","24-hour security"],"answer":2,"explanation":"NOT 題要逐一比對。健身中心、屋頂花園、24 小時保全都有提到，只有餐廳沒有。","vocab":[["feature","設施；特色"],["suite","套房；辦公室單位"]],"group":"g7"},{"part":"P7","stem":"How can a business receive two months of free rent?","options":["By signing a long-term lease before a deadline","By renting more than 5,000 square feet","By paying for underground parking","By touring the building in March"],"answer":0,"explanation":"3 月 31 日前簽三年以上租約可免兩個月租金，改寫成「在期限前簽長期租約」。","vocab":[["rent-free","免租金的"],["arrange a tour","安排參觀"]],"group":"g7"}]},{"topic":"主題：零售與促銷","passages":{"g6":{"kind":"E-mail","title":"To: Valued Members / From: Lakeside Outfitters / Subject: Members-Only Sale","text":"Dear Member,\n\nAs a thank-you for your loyalty, we are inviting you to an exclusive sale on Saturday, April 12. All items in the store will be [7] by 25 percent.\n\n[8] Simply show your membership card at the register. We look forward to seeing you!"},"g7":{"kind":"Notice","title":"Return Policy: Greenleaf Home Goods","text":"Unused items may be returned within 30 days of purchase for a full refund to the original payment method. Items returned after 30 days but within 60 days will receive store credit only. A receipt is required for all returns.\n\nFurniture and large appliances must be returned by arranging a pickup through our customer service department; a $25 pickup fee applies. Sale items marked \"Final Sale\" cannot be returned."}},"questions":[{"part":"P2","prompt":"Do you have this jacket in a larger size?","options":["It's on sale this week.","Let me check in the back.","I bought it in March."],"answer":1,"explanation":"問有沒有大一號，店員說「我去後面看看」是典型的間接回答。","vocab":[["size","尺寸"],["in the back","在後面（倉庫）"]]},{"part":"P2","prompt":"Where can I find the electronics section?","options":["Just past the checkout counters.","About fifty dollars.","He's an electrician."],"answer":0,"explanation":"Where 問位置，回答「過了結帳櫃台就是」。electrician 和 electronics 是相似音陷阱。","vocab":[["section","區域"],["checkout counter","結帳櫃台"]]},{"part":"P5","stem":"Customers who spend more than $100 will receive a ______ gift.","options":["compliment","complimentary","complementary","complimenting"],"answer":1,"explanation":"complimentary 是「免費贈送的」，complementary 是「互補的」，兩字常考易混淆。","vocab":[["complimentary","免費的"]]},{"part":"P5","stem":"The store will remain open ______ 10 P.M. during the holiday season.","options":["by","since","within","until"],"answer":3,"explanation":"remain open 是持續的狀態，持續「到」某時間點用 until。by 用於「在某時之前完成」。","vocab":[["remain","保持"],["holiday season","假期旺季"]]},{"part":"P5","stem":"Sales of winter clothing were higher this year ______ last year.","options":["then","as","than","from"],"answer":2,"explanation":"比較級 higher 搭配 than。then（然後）是拼字相近的陷阱。","vocab":[["clothing","服飾"]]},{"part":"P5","stem":"Only items in their original packaging ______ for exchange.","options":["accepts","are accepted","accepting","have accepted"],"answer":1,"explanation":"商品是「被」接受換貨，主詞 items 是複數，用被動 are accepted。","vocab":[["packaging","包裝"],["exchange","換貨"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["reduced","reducing","reduction","reduce"],"answer":0,"explanation":"will be + p.p. 是被動語態，商品「被」降價 25%。","vocab":[["loyalty","忠誠度"],["exclusive","專屬的"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Our store was renovated in 2015.","Please return your membership card.","The event has been canceled.","The discount applies to both regular and sale items."],"answer":3,"explanation":"前一句說全面八折，下一句說出示會員卡即可，中間補充折扣適用範圍最連貫。活動取消與全文矛盾。","vocab":[["apply to","適用於"],["register","收銀台"]],"group":"g6"},{"part":"P7","stem":"What happens if an item is returned 45 days after purchase?","options":["The customer receives a full refund.","The customer receives store credit.","The item cannot be returned.","The customer pays a $25 fee."],"answer":1,"explanation":"45 天落在 30 到 60 天之間，只能拿到店內抵用金。這類題要把數字帶回原文比對。","vocab":[["store credit","店內抵用金"],["refund","退款"]],"group":"g7"},{"part":"P7","stem":"What is indicated about furniture?","options":["It cannot be returned.","It must be brought to the store.","It is picked up for a fee.","It is always on final sale."],"answer":2,"explanation":"家具和大型家電要安排到府收回，並收 25 元費用。","vocab":[["appliance","家電"],["pickup fee","收件費"]],"group":"g7"}]},{"topic":"主題：醫療與診所","passages":{"g6":{"kind":"Letter","title":"To: Mr. Paul Grant / From: Westside Dental Clinic / Subject: Appointment Reminder","text":"Dear Mr. Grant,\n\nThis is a reminder that you have a dental cleaning scheduled for Thursday, June 5, at 10:30 A.M. Please bring your insurance card and arrive a few minutes early to complete any [7] paperwork.\n\n[8] If you need to cancel or reschedule, please call us at least 24 hours in advance."},"g7":{"kind":"Article","title":"Health Fair Comes to Lakewood","text":"The Lakewood Community Center will host its annual health fair on Saturday, May 18, from 9:00 A.M. to 3:00 P.M. Local doctors and nurses will offer free blood pressure checks and eye exams. Nutrition experts will give short talks on healthy eating every hour.\n\nThe event is free and open to the public, but those who want an eye exam are encouraged to sign up in advance on the center's website, as spaces are limited."}},"questions":[{"part":"P2","prompt":"Would you like to schedule your next checkup now?","options":["I checked it twice.","The clinic is on Pine Street.","Sure, how about early next month?"],"answer":2,"explanation":"問要不要現在預約下次檢查，回答「好，下個月初如何」。checked 是相似字陷阱。","vocab":[["checkup","健康檢查"],["schedule","預約"]]},{"part":"P2","prompt":"Who's covering for Dr. Lopez while she's on vacation?","options":["Dr. Kim from the downtown clinic.","For about two weeks.","The book cover is blue."],"answer":0,"explanation":"Who 問人，cover for 是「代班」。第二個選項回答期間，cover 是同字陷阱。","vocab":[["cover for","代班"]]},{"part":"P5","stem":"Patients are asked to arrive 15 minutes ______ their appointment time.","options":["ahead","prior to","before of","previous"],"answer":1,"explanation":"prior to = before（在…之前），後面接名詞。ahead 要說 ahead of，before of 是錯誤用法。","vocab":[["prior to","在…之前"],["appointment","預約"]]},{"part":"P5","stem":"The new medication should be taken ______ with food to avoid stomach discomfort.","options":["prefer","preferable","preferably","preference"],"answer":2,"explanation":"修飾動詞片語 be taken with food 要用副詞 preferably（最好）。","vocab":[["medication","藥物"],["discomfort","不適"]]},{"part":"P5","stem":"Ms. Ito could not attend the meeting because she ______ a medical appointment.","options":["has had","will have","having","had"],"answer":3,"explanation":"主要子句是過去式 could not，原因子句也用過去式 had。","vocab":[["attend","出席"]]},{"part":"P5","stem":"Visitors ______ to the hospital after 8 P.M. must sign in at the front desk.","options":["come","comes","coming","came"],"answer":2,"explanation":"句子的主要動詞是 must sign in，空格是修飾 Visitors 的分詞片語（= who come），用 coming。","vocab":[["sign in","登記"],["front desk","櫃台"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["necessary","necessarily","necessity","necessitate"],"answer":0,"explanation":"修飾名詞 paperwork 要用形容詞 necessary。","vocab":[["insurance card","保險卡"],["paperwork","文件"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Thank you for your job application.","We look forward to seeing you.","Your cleaning was completed last week.","Our dentist has retired."],"answer":1,"explanation":"預約提醒信常用「期待見到您」作結。洗牙還沒進行，不能說已完成。","vocab":[["reschedule","改期"],["in advance","事先"]],"group":"g6"},{"part":"P7","stem":"What will be offered at the event?","options":["Discounted gym memberships","Cooking classes for children","Job interviews","Free health checks"],"answer":3,"explanation":"原文提到免費量血壓和視力檢查，概括為「免費健康檢查」。","vocab":[["blood pressure","血壓"],["nutrition","營養"]],"group":"g7"},{"part":"P7","stem":"Why should attendees register online?","options":["To receive a free meal","To reserve an eye exam","To pay the entrance fee","To give a talk"],"answer":1,"explanation":"想做視力檢查的人建議先上網報名，因為名額有限。活動本身免費，不需付入場費。","vocab":[["sign up","報名"],["limited","有限的"]],"group":"g7"}]},{"topic":"主題：銀行業務","passages":{"g6":{"kind":"E-mail","title":"To: Account Holders / From: Summit Bank / Subject: Branch Closure","text":"Dear Customer,\n\nWe are writing to inform you that our Oak Avenue branch will close [7] on March 28. All accounts held at this branch will automatically be transferred to our Main Street branch, located just two blocks away.\n\n[8] Your account numbers, cards, and checks will remain the same."},"g7":{"kind":"Notice","title":"Summit Bank Mobile App: New Features","text":"Starting this month, Summit Bank customers can deposit checks by taking a photo with their smartphone. Deposits made before 6:00 P.M. on business days will be available the next morning. The app also now allows customers to set up alerts for low balances and large purchases.\n\nTo use these features, update the app to version 5.2 or later. For questions, chat with a representative within the app."}},"questions":[{"part":"P2","prompt":"How do I open a savings account?","options":["The bank opens at nine.","Just fill out this form and show your ID.","I saved about ten percent."],"answer":1,"explanation":"How 問方法，回答填表並出示證件。opens、saved 都是同字或相似字陷阱。","vocab":[["savings account","儲蓄帳戶"],["fill out","填寫"]]},{"part":"P2","prompt":"Didn't you already transfer the money to the supplier?","options":["Yes, I did it this morning.","The supplier is in Taipei.","Transfer at Central Station."],"answer":0,"explanation":"否定疑問句在確認事情是否完成，回答「有，今天早上匯了」。第三個選項的 transfer 意思變成「轉車」。","vocab":[["transfer","匯款；轉乘"],["supplier","供應商"]]},{"part":"P5","stem":"The bank charges a small fee for ______ withdrawals made at other banks' ATMs.","options":["every","each","all","much"],"answer":2,"explanation":"withdrawals 是複數可數名詞，前面用 all。every 和 each 接單數名詞，much 接不可數名詞。","vocab":[["withdrawal","提款"],["charge a fee","收費"]]},{"part":"P5","stem":"Applicants for a business loan must provide financial statements for the ______ three years.","options":["previously","preview","previewed","previous"],"answer":3,"explanation":"the ______ three years 中修飾名詞要用形容詞 previous（之前的）。","vocab":[["financial statement","財務報表"],["loan","貸款"]]},{"part":"P5","stem":"Mr. Novak decided to ______ the loan offer because the interest rate was too high.","options":["decline","delay","deposit","deliver"],"answer":0,"explanation":"利率太高所以「婉拒」貸款方案，decline an offer 是常見搭配。","vocab":[["decline","婉拒"],["interest rate","利率"]]},{"part":"P5","stem":"______ you lose your bank card, call our 24-hour hotline immediately.","options":["Even","Despite","If","Whether"],"answer":2,"explanation":"「如果」遺失卡片就立刻打電話，用 if。Despite 是介系詞不能接子句，Even 是副詞。","vocab":[["hotline","專線"],["immediately","立刻"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["permanent","permanently","permanence","permanents"],"answer":1,"explanation":"修飾動詞 close 要用副詞 permanently（永久地）。","vocab":[["branch","分行"],["permanently","永久地"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["You do not need to take any action.","Please visit the branch to apply for a new card.","Our interest rates have increased.","The Main Street branch will also close."],"answer":0,"explanation":"前一句說帳戶會自動轉移，後一句說帳號和卡片都不變，中間補「您不需要做任何事」最連貫。要求申請新卡與後文矛盾。","vocab":[["automatically","自動地"],["remain the same","維持不變"]],"group":"g6"},{"part":"P7","stem":"What is a new feature of the app?","options":["Applying for loans","Depositing checks with a photo","Opening new accounts","Exchanging currency"],"answer":1,"explanation":"第一句說可以用手機拍照存入支票。","vocab":[["deposit","存入"],["check","支票"]],"group":"g7"},{"part":"P7","stem":"What must customers do to use the new features?","options":["Visit a branch","Call a representative","Pay a monthly fee","Update the app"],"answer":3,"explanation":"原文說要更新到 5.2 版以上才能使用新功能。","vocab":[["balance","餘額"],["alert","通知"]],"group":"g7"}]},{"topic":"主題：研討會與展覽","passages":{"g6":{"kind":"E-mail","title":"To: Registered Attendees / From: Global Retail Summit / Subject: Venue Change","text":"Dear Attendee,\n\nDue to higher-than-expected registration numbers, the Global Retail Summit will now take place at the Grand Convention Center [7] the Westview Hotel. The dates and schedule remain unchanged.\n\n[8] Shuttle buses will run from the Westview Hotel to the new venue every 20 minutes."},"g7":{"kind":"Article","title":"Green Tech Expo Draws Record Crowd","text":"VANCOUVER — The fifth annual Green Tech Expo attracted more than 18,000 visitors over three days, organizers said on Sunday. That is nearly double last year's attendance. Exhibitors displayed products ranging from electric bicycles to home solar systems.\n\nOrganizers say the event will move to a larger venue next year and will be extended to four days. Exhibitor applications for next year's expo will open on January 15."}},"questions":[{"part":"P2","prompt":"Are you presenting at the technology conference next week?","options":["It was a nice present.","No, but my manager is.","In Hall B."],"answer":1,"explanation":"Yes/No 問句，回答「我沒有，但我主管有」。present（禮物）是同字異義陷阱。","vocab":[["present","發表"],["conference","研討會"]]},{"part":"P2","prompt":"Where can I pick up my conference badge?","options":["Around ten o'clock.","Yes, I picked one up.","At the registration desk in the lobby."],"answer":2,"explanation":"Where 問地點，回答大廳的報到台。","vocab":[["badge","識別證"],["registration desk","報到處"]]},{"part":"P5","stem":"The keynote speech will be delivered ______ Dr. Rachel Moore, a leading expert in robotics.","options":["by","from","with","of"],"answer":0,"explanation":"被動語態 be delivered by + 執行者，演講「由」某人發表。","vocab":[["keynote speech","主題演講"],["leading expert","頂尖專家"]]},{"part":"P5","stem":"Attendees are encouraged to register early, ______ seating is limited.","options":["so","but","unless","as"],"answer":3,"explanation":"as 在這裡是「因為」，說明要早報名的原因。so 會變成「所以座位有限」，因果顛倒。","vocab":[["attendee","與會者"],["seating","座位"]]},{"part":"P5","stem":"More than 300 companies ______ in this year's trade show.","options":["participate","are participating","participation","participant"],"answer":1,"explanation":"主詞 companies 後面缺動詞，配合 this year's 表示正在進行的事，用 are participating。","vocab":[["participate in","參加"],["trade show","商展"]]},{"part":"P5","stem":"The exhibition hall was ______ crowded that many visitors had to wait outside.","options":["such","so","too","very"],"answer":1,"explanation":"so + 形容詞 + that 表示「如此…以至於」。such 後面要接名詞片語。","vocab":[["exhibition hall","展覽館"],["crowded","擁擠的"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["instead of","in addition to","as well as","on behalf of"],"answer":0,"explanation":"場地從 Westview 飯店「改為」會議中心，instead of 表示取代。","vocab":[["venue","場地"],["registration","報名"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The summit has been canceled.","The convention center was built in 1990.","We understand that some of you have booked rooms at the Westview Hotel.","Registration is now closed for next year."],"answer":2,"explanation":"下一句說從 Westview 飯店有接駁車，前面先提到「有些人已經訂了該飯店」最連貫。","vocab":[["shuttle bus","接駁車"],["remain unchanged","維持不變"]],"group":"g6"},{"part":"P7","stem":"What is indicated about this year's expo?","options":["It lasted four days.","It had more visitors than last year.","It was held for the first time.","It focused on electric cars only."],"answer":1,"explanation":"原文說人數幾乎是去年的兩倍。今年是第五屆、為期三天，四天是明年的計畫。","vocab":[["attendance","參加人數"],["exhibitor","參展商"]],"group":"g7"},{"part":"P7","stem":"What will change next year?","options":["The ticket price","The city where it is held","The length of the event","The application deadline"],"answer":2,"explanation":"明年會延長為四天，也就是活動長度改變。換的是更大的場地，不是換城市。","vocab":[["extend","延長"],["application","申請"]],"group":"g7"}]},{"topic":"主題：員工教育訓練","passages":{"g6":{"kind":"Memo","title":"To: Sales Department / From: Human Resources / Subject: Customer Service Training","text":"All sales staff are invited to attend a customer service training program next month. The program will focus on [7] communication skills and handling difficult customers.\n\nSessions will be held every Tuesday from 3:00 to 5:00 P.M. [8] Please register with Human Resources by May 20."},"g7":{"kind":"Advertisement","title":"Learn Business English Online","text":"Speak with confidence at work! ProTalk Academy offers live online classes in business English, taught by experienced instructors. Classes are limited to six students and focus on presentations, meetings, and e-mail writing. Choose from morning, evening, or weekend schedules.\n\nNew students can try their first class for free. Companies that enroll five or more employees receive a 20 percent discount on tuition."}},"questions":[{"part":"P2","prompt":"Who's leading the leadership workshop tomorrow?","options":["A consultant from Boston.","In the training room.","It leads to the main hall."],"answer":0,"explanation":"Who 問人，回答一位顧問。leads 是同字異義陷阱（通往）。","vocab":[["consultant","顧問"],["workshop","工作坊"]]},{"part":"P2","prompt":"Should I sign up for the morning or the afternoon session?","options":["I signed the form.","The afternoon one is less crowded.","Yes, I'll be there."],"answer":1,"explanation":"選擇疑問句要從兩者中擇一，建議下午場並說明理由。","vocab":[["sign up for","報名"],["session","場次"]]},{"part":"P5","stem":"New employees are required to complete an online safety course ______ their first week.","options":["while","between","since","during"],"answer":3,"explanation":"during + 名詞（期間），their first week 是名詞片語。while 是連接詞要接子句。","vocab":[["complete","完成"],["safety course","安全課程"]]},{"part":"P5","stem":"The training manual was revised to make the instructions ______ to follow.","options":["easily","ease","easier","easiest"],"answer":2,"explanation":"make + 受詞 + 形容詞，修改後「更容易」理解，用比較級 easier。","vocab":[["manual","手冊"],["revise","修訂"]]},{"part":"P5","stem":"Participants who complete all five modules will be awarded a ______ of completion.","options":["certificate","certify","certified","certifying"],"answer":0,"explanation":"冠詞 a 後面要接名詞，certificate of completion 是「結業證書」。","vocab":[["module","單元"],["certificate","證書"]]},{"part":"P5","stem":"Ms. Barnes has been asked to ______ the new staff on how to use the inventory system.","options":["inform","instruct","introduce","insist"],"answer":1,"explanation":"instruct someone on how to... 是「指導某人如何做」。inform 是告知事實，insist 是堅持。","vocab":[["instruct","指導"],["inventory","庫存"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["improve","improving","improved","improvement"],"answer":1,"explanation":"介系詞 on 後面接動名詞，focus on improving 而且後面有受詞 communication skills。","vocab":[["focus on","著重於"],["handle","處理"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Our sales figures declined last year.","The program ended last month.","Light refreshments will be provided at each session.","Please return your uniforms."],"answer":2,"explanation":"前一句說明上課時間，補充「每次提供點心」符合課程公告的內容。課程是下個月才開始，不可能已經結束。","vocab":[["refreshments","點心飲料"],["register","報名"]],"group":"g6"},{"part":"P7","stem":"What is mentioned about the classes?","options":["They are held in a classroom.","They have a small number of students.","They are only on weekends.","They focus on travel English."],"answer":1,"explanation":"原文說每班限六人，改寫成「學生人數少」。課程是線上進行，時段也不只週末。","vocab":[["instructor","講師"],["be limited to","限制在"]],"group":"g7"},{"part":"P7","stem":"Who is eligible for a discount?","options":["Companies enrolling several employees","Students who try a free class","Instructors with experience","Students who study in the evening"],"answer":0,"explanation":"幫五位以上員工報名的公司享學費八折。試上第一堂免費，但不是折扣條件。","vocab":[["enroll","註冊；報名"],["tuition","學費"]],"group":"g7"}]},{"topic":"主題：環保與永續","passages":{"g6":{"kind":"Notice","title":"To: All Residents / From: Clearview City Council / Subject: New Recycling Schedule","text":"Beginning September 1, recycling will be collected every week instead of every two weeks. This change is part of the city's plan to [7] the amount of waste sent to landfills.\n\n[8] Residents can pick up new bins free of charge at City Hall."},"g7":{"kind":"E-mail","title":"To: All Staff / From: Facilities Team / Subject: Green Office Challenge","text":"Dear colleagues,\n\nOur office has been selected to take part in the city's Green Office Challenge from April 1 to June 30. The goal is to reduce electricity use by 15 percent compared with last year. Simple steps, such as turning off computers at the end of the day and using the stairs, can make a big difference.\n\nThe department that saves the most energy will receive a catered lunch in July.\n\nThank you,\nFacilities Team"}},"questions":[{"part":"P2","prompt":"What can we do to reduce paper use in the office?","options":["It's on the top shelf.","Yes, it's recycled.","We could share documents online instead."],"answer":2,"explanation":"問如何減少用紙，提出「改成線上分享文件」的建議。","vocab":[["reduce","減少"],["share","分享"]]},{"part":"P2","prompt":"The city is offering grants for installing solar panels.","options":["Really? We should apply.","I'll install the software.","The panel discussion starts at noon."],"answer":0,"explanation":"陳述句提供資訊，回應「我們應該申請」最合理。install、panel 都是同字陷阱。","vocab":[["grant","補助金"],["apply","申請"]]},{"part":"P5","stem":"The company aims to become ______ carbon neutral by 2035.","options":["complete","completely","completion","completed"],"answer":1,"explanation":"修飾形容詞 carbon neutral 要用副詞 completely。","vocab":[["aim to","目標是"],["carbon neutral","碳中和"]]},{"part":"P5","stem":"All plastic bottles should be placed in the blue bins, ______ are located on each floor.","options":["who","what","which","where"],"answer":2,"explanation":"先行詞是物（blue bins），逗號後的非限定子句用 which，而且空格後直接接動詞 are。","vocab":[["bin","回收桶"],["be located","位於"]]},{"part":"P5","stem":"The new packaging is made ______ 100 percent recycled materials.","options":["by","at","to","from"],"answer":3,"explanation":"be made from + 原料（看不出原形）。recycled materials 經過加工製成包裝。","vocab":[["packaging","包裝"],["recycled","回收再製的"]]},{"part":"P5","stem":"Employees are encouraged to use public transportation ______ driving to work.","options":["so that","rather than","as if","in case"],"answer":1,"explanation":"rather than + V-ing（而不是）。so that、as if、in case 都要接子句。","vocab":[["public transportation","大眾運輸"],["encourage","鼓勵"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["lower","lowly","lowness","lowering"],"answer":0,"explanation":"plan to + 原形動詞，lower 當動詞是「降低」。","vocab":[["landfill","掩埋場"],["waste","垃圾"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The landfill will close next week.","Each household is also entitled to a larger recycling bin.","Garbage fees will double.","City Hall is closed on weekends."],"answer":1,"explanation":"下一句說可以到市政府免費領新桶子，前面先說「每戶可領更大的回收桶」最連貫。","vocab":[["household","家戶"],["be entitled to","有權獲得"]],"group":"g6"},{"part":"P7","stem":"What is the goal of the challenge?","options":["To recycle more paper","To plant trees","To hire more staff","To reduce energy use"],"answer":3,"explanation":"原文說目標是用電量比去年減少 15%，改寫成 reduce energy use。","vocab":[["electricity","電力"],["compared with","與…相比"]],"group":"g7"},{"part":"P7","stem":"What will the winning department receive?","options":["Extra vacation days","A free meal","New computers","A cash bonus"],"answer":1,"explanation":"最省電的部門可以得到 7 月的外燴午餐，改寫成 a free meal。","vocab":[["catered lunch","外燴午餐"],["take part in","參加"]],"group":"g7"}]},{"topic":"主題：媒體與出版","passages":{"g6":{"kind":"Letter","title":"To: Ms. Laura Bennett / From: Northlight Publishing / Subject: Your Manuscript","text":"Dear Ms. Bennett,\n\nThank you for submitting your manuscript, The Silent Harbor, to Northlight Publishing. Our editorial team has read it with great interest, and we would like to [7] it next spring.\n\n[8] Our editor, James Hart, will contact you next week to discuss the contract and the publication schedule.\n\nSincerely,\nNorthlight Publishing"},"g7":{"kind":"Article","title":"City Times Launches Podcast","text":"The City Times newspaper launched its first podcast on Monday. The weekly program, called Behind the Headlines, features interviews with the paper's reporters about how they research their stories. Each episode is about 30 minutes long and is released every Thursday.\n\nEditor-in-chief Maria Gomez said the podcast is part of an effort to attract younger readers. Listeners can find it on major podcast apps or on the newspaper's website."}},"questions":[{"part":"P2","prompt":"When is the deadline for the magazine article?","options":["It's a monthly magazine.","Friday at noon.","About two thousand words."],"answer":1,"explanation":"When 問時間，回答截稿時間。最後一個選項回答字數。","vocab":[["deadline","截止期限"],["article","文章"]]},{"part":"P2","prompt":"Have you read the review of our new book?","options":["Not yet. Was it positive?","I'll review the budget.","At the bookstore."],"answer":0,"explanation":"問有沒有看書評，回答「還沒，評價好嗎？」最自然。review 是同字陷阱。","vocab":[["review","評論"],["positive","正面的"]]},{"part":"P5","stem":"The author's latest novel has been translated ______ twelve languages.","options":["onto","to","in","into"],"answer":3,"explanation":"translate A into B（把 A 翻譯成 B）是固定搭配。","vocab":[["translate","翻譯"],["latest","最新的"]]},{"part":"P5","stem":"Subscribers will receive the digital edition ______ the print version is mailed.","options":["until","during","before","by"],"answer":2,"explanation":"空格後是子句，需要連接詞；語意是紙本寄出「之前」先收到電子版，用 before。during 和 by 是介系詞。","vocab":[["subscriber","訂戶"],["edition","版本"]]},{"part":"P5","stem":"The editor asked the reporter to ______ the article to fit the available space.","options":["shorten","short","shortly","shortage"],"answer":0,"explanation":"ask + 人 + to + 原形動詞，需要動詞 shorten（縮短）。","vocab":[["editor","編輯"],["fit","符合"]]},{"part":"P5","stem":"The documentary received ______ reviews from critics around the world.","options":["favor","favorable","favorably","favored"],"answer":1,"explanation":"修飾名詞 reviews 要用形容詞 favorable（好評的）。","vocab":[["documentary","紀錄片"],["critic","評論家"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["publisher","publish","publication","published"],"answer":1,"explanation":"would like to + 原形動詞，用 publish（出版）。","vocab":[["manuscript","稿件"],["editorial team","編輯團隊"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Unfortunately, we cannot accept it.","Our office will be closed next week.","Please send us your résumé.","Congratulations on this achievement."],"answer":3,"explanation":"出版社決定出版這本書，接著說「恭喜」最自然。「無法接受」與前句矛盾，辦公室休息也和下週聯絡矛盾。","vocab":[["achievement","成就"],["contract","合約"]],"group":"g6"},{"part":"P7","stem":"What is the podcast about?","options":["Local sports results","Cooking and recipes","How reporters prepare their stories","Job opportunities"],"answer":2,"explanation":"節目訪問記者如何研究報導，改寫成「記者如何準備報導」。","vocab":[["episode","一集"],["headline","頭條"]],"group":"g7"},{"part":"P7","stem":"Why did the newspaper start the podcast?","options":["To reduce printing costs","To appeal to younger audiences","To replace its website","To hire more reporters"],"answer":1,"explanation":"總編輯說這是為了吸引年輕讀者，attract 改寫成 appeal to。","vocab":[["attract","吸引"],["editor-in-chief","總編輯"]],"group":"g7"}]},{"topic":"主題：交通與通勤","passages":{"g6":{"kind":"Notice","title":"To: Metro Riders / From: City Transit Authority / Subject: Weekend Service Changes","text":"Due to track maintenance, the Blue Line will not operate between Central Station and Airport Station this weekend. Free shuttle buses will [7] passengers between these stations.\n\n[8] Riders should allow an extra 30 minutes for their trips. Regular service will resume on Monday morning."},"g7":{"kind":"E-mail","title":"To: All Employees / From: Human Resources / Subject: Commuter Benefit Program","text":"We are pleased to announce a new commuter benefit program starting January 1. Employees who travel to work by public transportation will receive a monthly allowance of $80.\n\nThose who ride bicycles to work can use the new secure bike storage room in the basement, along with shower facilities. To join the program, complete the form on the HR page of the intranet by December 15."}},"questions":[{"part":"P2","prompt":"How do you usually get to work?","options":["About eight thirty.","I take the subway.","Yes, I work there."],"answer":1,"explanation":"How 在這裡問交通方式，回答搭地鐵。第一個選項回答時間。","vocab":[["get to work","上班（通勤）"],["subway","地鐵"]]},{"part":"P2","prompt":"The train to Taichung has been delayed again.","options":["Then we'd better call the client :["A free parking space","A monthly payment","A new bicycle","A shorter workday"],"answer":1,"explanation":"搭大眾運輸的員工每月可領 80 元津貼，allowance 改寫成 monthly payment。","vocab":[["allowance","津貼"],["commuter","通勤者"]],"group":"g7"},{"part":"P7","stem":"By when must employees complete a form?","options":["January 1","The end of the month","December 1","December 15"],"answer":3,"explanation":"原文說要在 12 月 15 日前填表。1 月 1 日是計畫開始日期，是常見干擾。","vocab":[["complete a form","填寫表格"],["basement","地下室"]],"group":"g7"}]},{"topic":"主題：採購與供應商","passages":{"g6":{"kind":"E-mail","title":"To: Kevin Wu, Apex Paper Supplies / From: Diane Ross / Subject: Order Inquiry","text":"Dear Mr. Wu,\n\nWe are interested in placing a large order of printer paper for our five offices. Could you please send us a price quote for 500 boxes? We would also like to know [7] you offer discounts for regular monthly orders.\n\n[8] If possible, we would like to receive the first delivery by the end of this month.\n\nBest regards,\nDiane Ross"},"g7":{"kind":"Notice","title":"Vendor Registration Notice: Harmon Hospital","text":"Harmon Hospital is updating its list of approved vendors for medical and office supplies. All current and new vendors must complete the online registration form by August 31 to continue doing business with the hospital.\n\nVendors will need to provide a copy of their business license and proof of insurance. Registered vendors will be notified of upcoming purchasing opportunities by e-mail. Questions may be directed to the purchasing office at 555-0193."}},"questions":[{"part":"P2","prompt":"Which supplier offered the lowest price?","options":["The one based in Vietnam.","Lower the volume, please.","Yes, it was quite cheap."],"answer":0,"explanation":"Which 問哪一個，用 The one... 回答。lower 是相似字陷阱，Yes 不能回答 Wh- 問句。","vocab":[["supplier","供應商"],["based in","總部設在"]]},{"part":"P2","prompt":"Why don't we order the parts in bulk?","options":["Because they're in the box.","That would save us a lot of money.","The order arrived late."],"answer":1,"explanation":"Why don't we 是提出建議，回答「那會省很多錢」表示贊同。用 Because 回答是陷阱。","vocab":[["in bulk","大量"],["part","零件"]]},{"part":"P5","stem":"Please compare the quotes from all three vendors ______ making a final decision.","options":["until","during","before","unless"],"answer":2,"explanation":"做決定「之前」先比較報價，before + V-ing。","vocab":[["quote","報價"],["vendor","廠商"]]},{"part":"P5","stem":"The purchasing department is ______ for negotiating contracts with suppliers.","options":["response","responsibly","responsibility","responsible"],"answer":3,"explanation":"be responsible for（負責）是固定搭配，be 動詞後接形容詞。","vocab":[["purchasing department","採購部"],["negotiate","協商"]]},{"part":"P5","stem":"Orders placed after 3 P.M. will be processed ______ the following business day.","options":["on","in","at","by"],"answer":0,"explanation":"特定的某一天用介系詞 on。","vocab":[["place an order","下訂單"],["process","處理"]]},{"part":"P5","stem":"We have decided to switch suppliers because the quality of their materials has ______ declined.","options":["steady","steadily","steadiness","steadied"],"answer":1,"explanation":"修飾動詞 declined 要用副詞 steadily（持續地）。","vocab":[["switch","更換"],["decline","下降"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["either","whether","unless","despite"],"answer":1,"explanation":"know whether...（知道是否…）引導名詞子句作受詞。","vocab":[["price quote","報價單"],["regular","定期的"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Please include the expected delivery time in your quote.","Thank you for paying your invoice.","Our offices are closed in August.","We received your résumé."],"answer":0,"explanation":"下一句提到希望月底前收到貨，前面請對方「在報價中註明交期」最連貫。","vocab":[["delivery time","交貨時間"],["inquiry","詢問"]],"group":"g6"},{"part":"P7","stem":"What are vendors asked to do?","options":["Lower their prices","Visit the hospital","Register online by a deadline","Deliver supplies by August 31"],"answer":2,"explanation":"所有廠商必須在 8 月 31 日前完成線上登記。8 月 31 日是登記期限，不是交貨期限。","vocab":[["approved vendor","合格廠商"],["registration","登記"]],"group":"g7"},{"part":"P7","stem":"What is NOT required from vendors?","options":["A business license","Proof of insurance","A completed form","A list of references"],"answer":3,"explanation":"原文要求營業執照、保險證明和線上表格，沒有提到推薦名單。","vocab":[["business license","營業執照"],["proof of insurance","保險證明"]],"group":"g7"}]},{"topic":"主題：合併與組織調整","passages":{"g6":{"kind":"Memo","title":"To: All Staff / From: Office of the President / Subject: Organizational Changes","text":"I am writing to share some important news. Effective March 1, the sales and marketing departments will be [7] into a single Customer Growth department, led by Angela Park.\n\nThis change will help us work more efficiently and respond faster to customer needs. [8] Ms. Park will hold a meeting with both teams next Monday to answer your questions."},"g7":{"kind":"Article","title":"Delta Foods to Acquire Sunny Farms","text":"Delta Foods announced yesterday that it has agreed to acquire Sunny Farms, a family-owned producer of organic juices, for $45 million. The deal is expected to be completed by the end of the year.\n\nSunny Farms will continue to operate under its own brand name, and its founder, Robert Hale, will stay on as an adviser. Delta Foods said the acquisition will allow it to enter the growing market for organic beverages."}},"questions":[{"part":"P2","prompt":"When will the merger be officially announced?","options":["Both companies are in Seoul.","Yes, it was announced.","Sometime next week, I believe."],"answer":2,"explanation":"When 問時間，回答「應該是下週」。Yes 不能回答 Wh- 問句。","vocab":[["merger","合併"],["officially","正式地"]]},{"part":"P2","prompt":"Is the marketing team moving to the fifth floor?","options":["Only some of them.","The movie was great.","Fifth in line."],"answer":0,"explanation":"Yes/No 問句也可以用部分肯定回答，「只有部分人」。movie 和 moving 音近，fifth 是同字陷阱。","vocab":[["move","搬遷"]]},{"part":"P5","stem":"Following the merger, the two companies will ______ their customer service operations.","options":["combination","combine","combined","combining"],"answer":1,"explanation":"助動詞 will 後面接原形動詞 combine（合併）。","vocab":[["following","在…之後"],["operation","業務"]]},{"part":"P5","stem":"Mr. Hassan will be in charge of the new division, ______ will focus on overseas markets.","options":["which","who","where","whose"],"answer":0,"explanation":"先行詞是 the new division（物），逗號後的非限定子句用 which，空格後直接接動詞。","vocab":[["in charge of","負責"],["division","部門"]]},{"part":"P5","stem":"Employees will be notified of any changes ______ the restructuring process.","options":["among","between","onto","throughout"],"answer":3,"explanation":"throughout + 期間 = 在整個過程中。","vocab":[["notify","通知"],["restructuring","重組"]]},{"part":"P5","stem":"The CEO stated that no jobs would be lost ______ the acquisition.","options":["in spite","so as","as a result of","in order that"],"answer":2,"explanation":"空格後是名詞 the acquisition，as a result of（由於）是介系詞片語。in spite 少了 of，so as 和 in order that 用法不合。","vocab":[["state","表示"],["acquisition","收購"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["merge","merging","merged","merger"],"answer":2,"explanation":"will be + p.p. 被動語態，兩部門「被合併」成一個。","vocab":[["effective","自…起生效"],["efficiently","有效率地"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Our sales increased by 5 percent last year.","I understand that you may have questions about how this affects your role.","The cafeteria menu will change.","Ms. Park joined the company in 1990."],"answer":1,"explanation":"下一句說會開會回答大家的問題，前面先說「我知道各位可能有疑問」最連貫。","vocab":[["affect","影響"],["role","職務"]],"group":"g6"},{"part":"P7","stem":"What is the article mainly about?","options":["A company's purchase of another company","The opening of a new factory","A new organic juice flavor","A change in food safety laws"],"answer":0,"explanation":"第一句說 Delta Foods 同意收購 Sunny Farms，acquire 改寫成 purchase。","vocab":[["acquire","收購"],["family-owned","家族經營的"]],"group":"g7"},{"part":"P7","stem":"What is suggested about Sunny Farms?","options":["It will change its name.","It will keep its brand.","Its founder will retire.","It sells mainly frozen foods."],"answer":1,"explanation":"原文說會繼續以自己的品牌經營。創辦人會留任顧問，不是退休。","vocab":[["brand name","品牌名稱"],["adviser","顧問"]],"group":"g7"}]},{"topic":"主題：旅館與觀光","passages":{"g6":{"kind":"E-mail","title":"To: Ms. Anna Scott / From: Seaside Grand Hotel / Subject: Reservation Confirmation","text":"Dear Ms. Scott,\n\nThank you for choosing the Seaside Grand Hotel. We are pleased to [7] your reservation for a deluxe ocean-view room from July 8 to July 12.\n\n[8] Breakfast is served daily in the Coral Restaurant from 6:30 to 10:00 A.M. We look forward to welcoming you."},"g7":{"kind":"Advertisement","title":"Explore Lake Hara: Guided Kayak Tours","text":"Discover the beauty of Lake Hara with Blue Paddle Tours. Our three-hour guided tours depart daily at 8:00 A.M. and 1:00 P.M. from May through October. No experience is needed; all equipment, including life jackets, is provided.\n\nTours cost $55 per adult and $30 for children under 12. Groups of ten or more receive one free ticket. Book online at bluepaddle.com at least 24 hours in advance."}},"questions":[{"part":"P2","prompt":"Does the hotel offer airport transportation?","options":["It's a five-star hotel.","Yes, there's a free shuttle every hour.","The airport is very large."],"answer":1,"explanation":"Yes/No 問句，回答「有，每小時一班免費接駁」。其他選項只重複 hotel、airport。","vocab":[["transportation","交通接送"],["shuttle","接駁車"]]},{"part":"P2","prompt":"What time is checkout?","options":["Eleven A.M.","At the front desk.","I'll check it out."],"answer":0,"explanation":"What time 問時間，回答上午十一點。check it out（看看）是相似音陷阱。","vocab":[["checkout","退房"]]},{"part":"P5","stem":"Guests may store their luggage at the front desk ______ their rooms are ready.","options":["by","during","since","until"],"answer":3,"explanation":"寄放行李是持續的動作，持續「到」房間準備好，用連接詞 until。","vocab":[["store","寄放"],["luggage","行李"]]},{"part":"P5","stem":"The tour package includes airfare, hotel accommodations, and ______ meals.","options":["select","selected","selecting","selection"],"answer":1,"explanation":"selected meals 是「部分指定餐點」，過去分詞當形容詞修飾名詞。","vocab":[["airfare","機票費"],["accommodations","住宿"]]},{"part":"P5","stem":"Visitors are asked not to take photographs ______ the museum.","options":["onto","upon","inside","through"],"answer":2,"explanation":"在博物館「裡面」不要拍照，用 inside。","vocab":[["photograph","照片"]]},{"part":"P5","stem":"The resort is ______ popular with families because of its large swimming pools.","options":["particular","particularly","particularity","particulars"],"answer":1,"explanation":"修飾形容詞 popular 要用副詞 particularly（特別地）。","vocab":[["resort","度假村"],["be popular with","受…歡迎"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["confirmation","confirm","confirmed","confirming"],"answer":1,"explanation":"be pleased to + 原形動詞，用 confirm（確認）。","vocab":[["reservation","預訂"],["deluxe","豪華的"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["Your room rate includes a daily breakfast buffet.","Unfortunately, your reservation has been canceled.","We are now hiring kitchen staff.","The hotel was renovated in 1970."],"answer":0,"explanation":"下一句說明早餐時間與地點，前面先說「房價含自助早餐」最連貫。預訂取消與確認信矛盾。","vocab":[["room rate","房價"],["buffet","自助餐"]],"group":"g6"},{"part":"P7","stem":"What is indicated about the tours?","options":["They require previous experience.","They run all year.","They last a full day.","They are offered twice a day."],"answer":3,"explanation":"每天早上 8 點和下午 1 點出發，一天兩梯。行程只在 5 到 10 月，為期三小時。","vocab":[["depart","出發"],["equipment","裝備"]],"group":"g7"},{"part":"P7","stem":"How can a group get a free ticket?","options":["By bringing their own kayaks","By booking on the same day","By booking for ten or more people","By taking the morning tour"],"answer":2,"explanation":"十人以上的團體可以獲得一張免費票。當天預約不行，至少要提前 24 小時。","vocab":[["in advance","事先"],["book","預訂"]],"group":"g7"}]},{"topic":"主題：員工福利","passages":{"g6":{"kind":"Memo","title":"To: All Employees / From: Human Resources / Subject: Wellness Program","text":"We are excited to introduce a new wellness program designed to help employees stay healthy. [7] the program, staff can attend free yoga classes, receive nutrition advice, and get discounts at local gyms.\n\n[8] To sign up, simply fill out the short form attached to this memo and return it to HR."},"g7":{"kind":"E-mail","title":"To: Kenji Sato / From: Benefits Office / Subject: Parental Leave Request","text":"Dear Mr. Sato,\n\nWe have received your request for parental leave from September 1 to November 30. Your request has been approved. During your leave, you will receive 80 percent of your regular salary, and your health insurance coverage will continue.\n\nPlease make sure to hand over your current projects to your team leader before August 25. If your plans change, contact this office at least two weeks in advance.\n\nRegards,\nBenefits Office"}},"questions":[{"part":"P2","prompt":"How many vacation days do new employees get?","options":["They're new here.","I went to Bali on vacation.","Fifteen days a year."],"answer":2,"explanation":"How many 問數量，回答一年 15 天。new、vacation 都是同字陷阱。","vocab":[["vacation day","休假日"]]},{"part":"P2","prompt":"Has the new health insurance plan been explained to everyone?","options":["HR will hold a meeting about it on Friday.","Yes, I'm healthy.","It's a plain design."],"answer":0,"explanation":"問是否已向大家說明，回答「人資週五會開說明會」，間接表示還沒。healthy、plain 是相似音陷阱。","vocab":[["health insurance","健康保險"],["explain","說明"]]},{"part":"P5","stem":"Employees are ______ for an extra week of paid leave after five years of service.","options":["available","eligible","capable","possible"],"answer":1,"explanation":"be eligible for（有資格獲得）是固定搭配。capable 要接 of。","vocab":[["eligible","有資格的"],["paid leave","有薪假"]]},{"part":"P5","stem":"The company gym is open to all staff members ______ charge.","options":["out of","instead of","free of","because of"],"answer":2,"explanation":"free of charge 是「免費」的固定說法。","vocab":[["free of charge","免費"]]},{"part":"P5","stem":"Ms. Lee requested a ______ work schedule so that she could take evening classes.","options":["flexible","flexibly","flexibility","flex"],"answer":0,"explanation":"冠詞 a 與名詞 work schedule 之間要用形容詞 flexible（彈性的）。","vocab":[["flexible","彈性的"],["request","要求"]]},{"part":"P5","stem":"Starting next year, employees will be able to work from home ______ two days a week.","options":["as far","by then","so far","up to"],"answer":3,"explanation":"up to + 數量表示「最多到」，每週最多兩天在家工作。","vocab":[["work from home","在家工作"],["up to","最多"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["Despite","Through","Unless","Although"],"answer":1,"explanation":"through + 名詞表示「透過」，透過這個計畫員工可以上瑜珈課。Unless 和 Although 是連接詞要接子句。","vocab":[["wellness program","健康促進計畫"],["nutrition","營養"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The program was canceled last year.","Our gym is closing permanently.","Participation is voluntary, but we hope many of you will join.","All employees must work overtime."],"answer":2,"explanation":"下一句說明如何報名，前面先說「自由參加，希望大家加入」最連貫。","vocab":[["voluntary","自願的"],["participation","參加"]],"group":"g6"},{"part":"P7","stem":"What is the purpose of the e-mail?","options":["To approve a leave request","To offer a promotion","To announce a new insurance plan","To request a meeting"],"answer":0,"explanation":"信中說已收到育嬰假申請並且核准。","vocab":[["parental leave","育嬰假"],["approve","核准"]],"group":"g7"},{"part":"P7","stem":"What is Mr. Sato asked to do before August 25?","options":["Submit a medical form","Transfer his work to a colleague","Visit the benefits office","Change his insurance plan"],"answer":1,"explanation":"原文說 8 月 25 日前要把手上的專案交接給組長，hand over 改寫成 transfer。","vocab":[["hand over","交接"],["coverage","保障範圍"]],"group":"g7"}]},{"topic":"主題：研發與新產品","passages":{"g6":{"kind":"E-mail","title":"To: Product Development Team / From: Sofia Grant / Subject: Testing Results","text":"Hi team,\n\nI'm happy to report that the first round of user testing for the SmartHome Hub went very well. Most participants found the device easy to set up, and many said they were [7] with its voice controls.\n\nHowever, several users said the instruction booklet was confusing. [8] Let's discuss possible changes at Thursday's meeting.\n\nSofia"},"g7":{"kind":"Article","title":"Nova Electronics Unveils Foldable Laptop","text":"Nova Electronics introduced its first foldable laptop, the Nova Flex, at a press event in Seoul on Tuesday. The device has a 17-inch screen that folds in half, making it about the size of a paperback book when closed.\n\nIt will be available in South Korea in March and in Europe and North America in May. The company said the price will be announced next month. Analysts expect the laptop to appeal mainly to business travelers."}},"questions":[{"part":"P2","prompt":"When will the prototype be ready for testing?","options":["In the research lab.","Hopefully by the end of the month.","It was a successful test."],"answer":1,"explanation":"When 問時間，回答「希望月底前」。第一個選項回答地點，test 是同字陷阱。","vocab":[["prototype","原型"],["ready for","準備好"]]},{"part":"P2","prompt":"We should get customer feedback before launching the product.","options":["Lunch is at noon.","It was fed yesterday.","I agree. Let's run a survey first."],"answer":2,"explanation":"陳述句提出建議，回答「同意，先做問卷」。lunch/launch、fed/feedback 都是相似音陷阱。","vocab":[["feedback","意見回饋"],["survey","問卷調查"]]},{"part":"P5","stem":"The research team spent two years ______ the new battery technology.","options":["develop","developing","developed","development"],"answer":1,"explanation":"spend + 時間 + V-ing（花時間做某事）。","vocab":[["battery","電池"],["technology","技術"]]},{"part":"P5","stem":"The new smartphone is lighter and ______ than the previous model.","options":["more durable","durably","durability","most durable"],"answer":0,"explanation":"and 連接兩個比較級，後面有 than，用 more durable。","vocab":[["durable","耐用的"],["previous","先前的"]]},{"part":"P5","stem":"The product launch has been postponed ______ further notice.","options":["by","for","within","until"],"answer":3,"explanation":"until further notice（直到另行通知）是固定說法。","vocab":[["postpone","延期"],["further notice","進一步通知"]]},{"part":"P5","stem":"Our engineers are working ______ to solve the overheating problem.","options":["diligent","diligently","diligence","more diligent"],"answer":1,"explanation":"修飾動詞 working 要用副詞 diligently（勤奮地）。","vocab":[["engineer","工程師"],["overheating","過熱"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["satisfy","satisfying","satisfied","satisfaction"],"answer":2,"explanation":"人「感到」滿意用過去分詞 satisfied，be satisfied with 是固定搭配。","vocab":[["user testing","使用者測試"],["set up","設定"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["We may need to rewrite it in simpler language.","The device will be discontinued.","Our team won an award last year.","The meeting room is being cleaned."],"answer":0,"explanation":"前一句說說明書難懂，接著提出「可能要用更簡單的語言改寫」最連貫，it 指說明書。","vocab":[["instruction booklet","說明書"],["confusing","令人困惑的"]],"group":"g6"},{"part":"P7","stem":"Where will the product first be sold?","options":["Europe","North America","South Korea","Japan"],"answer":2,"explanation":"3 月先在南韓上市，5 月才到歐洲和北美。","vocab":[["foldable","可折疊的"],["unveil","發表"]],"group":"g7"},{"part":"P7","stem":"What has NOT been announced yet?","options":["The size of the screen","The price","The release dates","The product name"],"answer":1,"explanation":"公司說價格下個月才會公布，其他資訊文中都有提到。","vocab":[["analyst","分析師"],["appeal to","吸引"]],"group":"g7"}]},{"topic":"主題：社區活動與志工","passages":{"g6":{"kind":"Notice","title":"To: Riverside Residents / From: Riverside Neighborhood Association / Subject: Annual Street Fair","text":"The
