ners.","options":["for","of","at","by"],"answer":0,"explanation":"為某對象舉辦工作坊用 for。","vocab":[["host","舉辦"],["a series of","一系列"]]},{"part":"P5","stem":"Thanks to the ______ of many local residents, the community garden opened on schedule.","options":["generous","generously","generosity","generousness"],"answer":2,"explanation":"the ______ of 中間要用名詞，generosity 是「慷慨」的正確名詞形。","vocab":[["resident","居民"],["on schedule","如期"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["featuring","featured","feature","features"],"answer":2,"explanation":"will 後面接原形動詞，feature 當動詞是「以…為特色」。","vocab":[["street fair","街頭市集"],["food stand","小吃攤"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The fair has been held indoors since 1990.","Visitors are encouraged to park at the Riverside Library lot.","Food stands will not be permitted.","Children under 12 may not attend."],"answer":1,"explanation":"前一句說主街封路，接著建議訪客到圖書館停車場停車最連貫。其他選項與前文矛盾。","vocab":[["closed to traffic","禁止車輛通行"],["lot","停車場"]],"group":"g6"},{"part":"P7","stem":"What is indicated about the food drive?","options":["It was held in the spring.","It served only one shelter.","It needed fewer volunteers.","It collected more food than last year."],"answer":3,"explanation":"原文說比去年多 30%，改寫成「收集的食物比去年多」。物資送到 15 個收容所，不是一個。","vocab":[["food drive","食物募集活動"],["shelter","收容所"]],"group":"g7"},{"part":"P7","stem":"What are interested volunteers asked to do?","options":["Call the food bank","Respond to the e-mail","Visit a shelter","Fill out an online form"],"answer":1,"explanation":"最後一句請有興趣的人回覆這封信，reply 改寫成 respond。","vocab":[["shift","班次"],["reply","回覆"]],"group":"g7"}]},{"topic":"主題：建築與裝修","passages":{"g6":{"kind":"Notice","title":"To: Tenants of Harbor Plaza / From: Building Management / Subject: Lobby Renovation","text":"Renovation of the main lobby will begin on Monday, October 6, and is expected to last about four weeks. During this period, the main entrance will be closed. Tenants and visitors should use the side entrance on Pine Street [7].\n\n[8] We apologize for any noise or inconvenience this may cause."},"g7":{"kind":"Advertisement","title":"Kingston Home Renovations","text":"Thinking about updating your kitchen or bathroom? Kingston Home Renovations has served the Bayview area for over 25 years. Our licensed team handles everything from design to installation, and every project comes with a five-year warranty.\n\nSchedule a free in-home consultation this month and receive 10 percent off any project over $5,000. Visit our showroom at 220 Harbor Road, open Monday through Saturday."}},"questions":[{"part":"P2","prompt":"How long will the lobby renovation take?","options":["It's a big lobby.","About six weeks.","Yes, it was renovated."],"answer":1,"explanation":"How long 問期間，回答大約六週。","vocab":[["renovation","裝修"],["lobby","大廳"]]},{"part":"P2","prompt":"Isn't the construction noise bothering you?","options":["Not really. I'm wearing headphones.","The construction company is in Taipei.","No, I didn't bother."],"answer":0,"explanation":"否定疑問句詢問感受，回答「還好，我戴著耳機」。construction、bother 都是同字陷阱。","vocab":[["construction","施工"],["bother","打擾"]]},{"part":"P5","stem":"The contractor assured us that the work would be completed ______ budget.","options":["among","between","within","along"],"answer":2,"explanation":"within budget（在預算內）是固定搭配。","vocab":[["contractor","承包商"],["assure","保證"]]},{"part":"P5","stem":"The building's ______ design has won several international awards.","options":["innovate","innovative","innovatively","innovation"],"answer":1,"explanation":"所有格與名詞 design 之間要用形容詞 innovative（創新的）。","vocab":[["innovative","創新的"],["award","獎項"]]},{"part":"P5","stem":"Access to the east wing will be ______ while the floors are being replaced.","options":["restricting","restriction","restrictive","restricted"],"answer":3,"explanation":"通道「被限制」，will be + p.p. 被動語態用 restricted。","vocab":[["access","出入"],["wing","（建築物）側翼"]]},{"part":"P5","stem":"The architect, along with her assistants, ______ the site every Monday.","options":["visits","visit","visiting","have visited"],"answer":0,"explanation":"along with 引導的插入語不影響主詞，主詞是單數 The architect，用 visits。","vocab":[["architect","建築師"],["site","工地"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["instead","instead of","rather","otherwise"],"answer":0,"explanation":"放在句尾的 instead 是副詞，表示「改走側門」。instead of 後面一定要接名詞。","vocab":[["entrance","入口"],["tenant","租戶"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The lobby was renovated two weeks ago.","Pine Street will be closed permanently.","Work will take place between 8:00 A.M. and 5:00 P.M. on weekdays only.","Tenants must move out by October 6."],"answer":2,"explanation":"下一句為噪音致歉，前面先說明施工時段最連貫。","vocab":[["take place","進行"],["apologize for","為…道歉"]],"group":"g6"},{"part":"P7","stem":"What is mentioned about Kingston Home Renovations?","options":["It was founded last year.","It offers a warranty on its work.","It only builds new houses.","It is open on Sundays."],"answer":1,"explanation":"每個工程都附五年保固。公司已經營 25 年以上，展示間週一到週六營業。","vocab":[["licensed","有執照的"],["warranty","保固"]],"group":"g7"},{"part":"P7","stem":"How can customers get a discount?","options":["By visiting the showroom on Saturday","By paying in cash","By spending less than $5,000","By scheduling a consultation this month"],"answer":3,"explanation":"本月預約免費到府諮詢，超過 5,000 元的工程打九折。","vocab":[["consultation","諮詢"],["showroom","展示間"]],"group":"g7"}]},{"topic":"主題：網路購物","passages":{"g6":{"kind":"E-mail","title":"To: Ms. Rachel Kim / From: ShopNow Customer Support / Subject: Order #A7731","text":"Dear Ms. Kim,\n\nWe are sorry to hear that the blender you ordered arrived damaged. We will send you a [7] at no cost. It should arrive within three to five business days.\n\n[8] You do not need to return the damaged item. Simply dispose of it in a safe manner."},"g7":{"kind":"Notice","title":"Updated Shipping Policy: Cozy Corner Online","text":"Effective May 1, Cozy Corner Online will offer free standard shipping on all orders of $35 or more, down from the previous minimum of $50. Standard delivery takes four to six business days.\n\nFor faster delivery, customers can choose express shipping for a flat fee of $12, with delivery in one to two business days. Orders placed on weekends will be processed on the next business day."}},"questions":[{"part":"P2","prompt":"Why hasn't my online order arrived yet?","options":["I ordered it online.","Yes, it arrived yesterday.","It's still being processed at the warehouse."],"answer":2,"explanation":"Why 問原因，回答「還在倉庫處理中」。Yes 不能回答 Wh- 問句，而且已到貨與題意矛盾。","vocab":[["process","處理"],["warehouse","倉庫"]]},{"part":"P2","prompt":"Can I pay for this with a gift card?","options":["Of course. Just enter the code at checkout.","It's a nice gift.","I'll pay you back."],"answer":0,"explanation":"詢問能否用禮物卡付款，回答「可以，結帳時輸入代碼」。gift、pay 是同字陷阱。","vocab":[["gift card","禮物卡"],["checkout","結帳"]]},{"part":"P5","stem":"Customers can track their orders by ______ into their online accounts.","options":["log","logging","logged","logs"],"answer":1,"explanation":"介系詞 by 後面接動名詞，by logging into（藉由登入）。","vocab":[["track","追蹤"],["log into","登入"]]},{"part":"P5","stem":"Free shipping is available on all orders ______ $50.","options":["among","within","over","through"],"answer":2,"explanation":"over + 金額表示「超過」。","vocab":[["free shipping","免運費"]]},{"part":"P5","stem":"The website was redesigned to make online shopping ______ convenient for users.","options":["much","many","most","more"],"answer":3,"explanation":"make + 受詞 + 形容詞，改版後「更」方便，用比較級 more convenient。","vocab":[["redesign","重新設計"],["convenient","方便的"]]},{"part":"P5","stem":"Items purchased online can be returned to any of our stores ______ by mail.","options":["nor","or","but","so"],"answer":1,"explanation":"退回門市「或」郵寄，表示選擇用 or。nor 用於否定句。","vocab":[["return","退貨"],["by mail","郵寄"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["replace","replacement","replaced","replacing"],"answer":1,"explanation":"冠詞 a 後面接名詞，replacement 是「替換品」。","vocab":[["blender","果汁機"],["damaged","損壞的"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["A tracking number will be sent to you by e-mail once it ships.","Please return the blender within 30 days.","Our store is closing next month.","Thank you for your job application."],"answer":0,"explanation":"前一句說新品幾天內寄到，接著說「出貨後會寄追蹤號碼」最連貫。要求退回果汁機與下一句矛盾。","vocab":[["tracking number","追蹤號碼"],["dispose of","處理掉"]],"group":"g6"},{"part":"P7","stem":"What change is being announced?","options":["Express shipping is now free.","The minimum for free shipping has been lowered.","Delivery times have become longer.","Weekend orders are no longer accepted."],"answer":1,"explanation":"免運門檻從 50 元降到 35 元，down from 改寫成 lowered。","vocab":[["effective","自…起生效"],["minimum","最低金額"]],"group":"g7"},{"part":"P7","stem":"How long does express shipping take?","options":["Four to six business days","One week","One to two business days","Same day"],"answer":2,"explanation":"快遞一到兩個工作天送達。四到六天是一般寄送，是干擾選項。","vocab":[["express shipping","快遞"],["flat fee","固定費用"]],"group":"g7"}]},{"topic":"主題：法務與合約","passages":{"g6":{"kind":"Letter","title":"To: Ms. Olivia Grant, Grant Design Studio / From: Mercer & Hall Law Firm / Subject: Service Agreement","text":"Dear Ms. Grant,\n\nEnclosed please find two copies of the service agreement between your studio and Lumen Technologies. Please review the document carefully and contact us if you have any questions about its [7].\n\n[8] Once both copies are signed, please return one to our office in the enclosed envelope.\n\nSincerely,\nMercer & Hall Law Firm"},"g7":{"kind":"E-mail","title":"To: All Managers / From: Legal Department / Subject: Contract Approval Process","text":"Dear Managers,\n\nTo reduce delays, we are changing the way contracts are approved. Starting next month, contracts worth less than $10,000 can be approved directly by department managers. Contracts above that amount must still be reviewed by the legal department, which will aim to respond within five business days.\n\nA new online form for submitting contracts will be available on the intranet from June 1.\n\nLegal Department"}},"questions":[{"part":"P2","prompt":"Has the legal department reviewed the agreement?","options":["They're looking at it now.","It was a long review.","Yes, I agree."],"answer":0,"explanation":"問法務是否審閱過，回答「正在看」。review、agree 都是同字或相似字陷阱。","vocab":[["agreement","協議"],["legal department","法務部"]]},{"part":"P2","prompt":"When does the current contract expire?","options":["The contractor is here.","It's very expensive.","At the end of June."],"answer":2,"explanation":"When 問時間，回答六月底。contractor 是相似字陷阱，expensive 和 expire 音近。","vocab":[["expire","到期"],["current","現行的"]]},{"part":"P5","stem":"Both parties must sign the contract ______ it can take effect.","options":["until","before","unless","while"],"answer":1,"explanation":"雙方簽約「之後」才生效，也就是生效「之前」必須簽約，用 before。","vocab":[["party","（合約）一方"],["take effect","生效"]]},{"part":"P5","stem":"The agreement ______ either party to end the contract with 30 days' notice.","options":["lets","makes","has","allows"],"answer":3,"explanation":"allow + 人 + to V（允許某人做…）。lets 和 makes 後面接原形動詞，不接 to。","vocab":[["either party","任一方"],["notice","預告"]]},{"part":"P5","stem":"Any changes to the terms must be made ______ writing.","options":["in","on","by","at"],"answer":0,"explanation":"in writing（以書面方式）是固定說法。","vocab":[["terms","條款"],["in writing","以書面"]]},{"part":"P5","stem":"The company's lawyers are reviewing the proposal ______.","options":["careful","carefully","care","careless"],"answer":1,"explanation":"修飾動詞 reviewing 要用副詞 carefully。","vocab":[["lawyer","律師"],["proposal","提案"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["turns","terms","tones","tents"],"answer":1,"explanation":"對合約有疑問，指的是合約 e helpful."}},"questions":[{"part":"P2","prompt":"When are the annual performance reviews scheduled?","options":["Yes, it was a good review.","During the first two weeks of December.","In the manager's office."],"answer":1,"explanation":"When 問時間，回答十二月前兩週。最後一個選項回答地點。","vocab":[["annual","年度的"],["performance review","績效考核"]]},{"part":"P2","prompt":"You received a promotion, didn't you?","options":["Yes, I'm now the team leader.","The promotion ends on Friday.","I received your e-mail."],"answer":0,"explanation":"附加問句確認是否升職，回答「是，我現在是組長」。promotion 也有「促銷」的意思，是同字異義陷阱。","vocab":[["promotion","升職；促銷"]]},{"part":"P5","stem":"Employees will be evaluated ______ on their contributions to team projects.","options":["main","mainly","maintain","mainstream"],"answer":1,"explanation":"修飾 on their contributions 要用副詞 mainly（主要地）。","vocab":[["evaluate","評估"],["contribution","貢獻"]]},{"part":"P5","stem":"Ms. Ruiz's performance this year has been ______ than that of any other sales representative.","options":["best","good","well","better"],"answer":3,"explanation":"後面有 than，要用比較級 better。than any other... 用比較級表達最高級的意思。","vocab":[["performance","表現"],["sales representative","業務代表"]]},{"part":"P5","stem":"Managers are expected to provide ______ feedback to their team members.","options":["construct","constructively","constructive","construction"],"answer":2,"explanation":"修飾名詞 feedback 要用形容詞 constructive（建設性的）。","vocab":[["constructive","建設性的"],["feedback","回饋"]]},{"part":"P5","stem":"Staff who ______ their sales targets will receive a year-end bonus.","options":["exceed","excess","excessive","exceedingly"],"answer":0,"explanation":"關係子句 who 後面需要動詞，exceed（超過）。excess 多當名詞或形容詞。","vocab":[["exceed","超過"],["target","目標"]]},{"part":"P6","stem":"Choose the word that best fits blank (7).","options":["instead of","according to","in addition","as well"],"answer":0,"explanation":"用新的線上系統「取代」紙本表格，instead of + 名詞。","vocab":[["evaluation","考核"],["submit","提交"]],"group":"g6"},{"part":"P6","stem":"Choose the sentence that best fits blank (8).","options":["The holiday party will be held on December 20.","Our offices will move next year.","Please return your company laptop.","Areas for improvement should also be clearly identified."],"answer":3,"explanation":"前一句說要寫具體成就，接著補充「也要明確寫出待改進之處」最連貫。","vocab":[["achievement","成就"],["identify","指出"]],"group":"g6"},{"part":"P7","stem":"Why does Ms. Wu contact Mr. Becker?","options":["To ask for a sales report by today","To offer him a new position","To arrange a meeting about his evaluation","To cancel a meeting"],"answer":2,"explanation":"第一則訊息問明天有沒有空討論他的自我評量，也就是約時間開會。","vocab":[["go over","檢視"],["self-evaluation","自我評量"]],"group":"g7"},{"part":"P7","stem":"At 4:08 P.M., what does Ms. Wu mean when she writes, \"That's fine\"?","options":["She is not worried that part of a document is unfinished.","She agrees to meet before 2:00.","She has already read the sales reports.","She wants to set next year's goals alone."],"answer":0,"explanation":"意圖題要看前一句：Tom 說明年目標那部分還沒寫完，Lena 說沒關係，可以一起寫，表示她不在意還沒完成。","vocab":[["section","部分"],["though","不過"]],"group":"g7"}]}];
  const START = "2026-10-22";
  const dnum = (s) => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
  const dstr = (n) => new Date(n * 86400000).toISOString().slice(0, 10);
  const N = BANK.length, t0 = dnum(today), s0 = dnum(START);
  S.days = [];
  for (let k = 0; k < N; k++) {
    const n = t0 - k;
    const idx = (((n - s0) % N) + N) % N;
    S.days.push(Object.assign({}, BANK[idx], { date: dstr(n), round: idx + 1 }));
  }
  S.dbState = "ready";
  $("syncNote").textContent = "作答紀錄存在這台裝置的瀏覽器。題庫共 " + N + " 回，每天自動輪替。";
  pickInitial();
  render();
})();

// ---------- app install ----------
(() => {
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  let dismissed = false; try { dismissed = localStorage.getItem("toeic750-install-x") === "1"; } catch (e) {}
  if (standalone || dismissed) return;
  const box = document.getElementById("install"), how = document.getElementById("installHow"), btn = document.getElementById("installBtn");
  document.getElementById("installX").onclick = () => { box.hidden = true; try { localStorage.setItem("toeic750-install-x", "1"); } catch (e) {} };
  const ua = navigator.userAgent;
  const iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (iOS) {
    how.textContent = /CriOS|FxiOS|Line|FBAN|Instagram/.test(ua) ? "請用 Safari 開啟這個網址，再點「分享」→「加入主畫面」。" : "點下方「分享」按鈕 →「加入主畫面」，就能像 App 一樣從桌面打開。";
    box.hidden = false;
  }
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferred = e;
    how.textContent = "安裝後可以從手機桌面直接開啟，離線也能練習。";
    btn.hidden = false; box.hidden = false;
  });
  btn.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; box.hidden = true; };
  window.addEventListener("appinstalled", () => { box.hidden = true; });
})();
