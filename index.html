<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a2030">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多益750">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>多益 750 每日十題</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
/* Layout: an answer-sheet strip on top, one question card below (passage | question on wide screens), archive at the bottom. */
:root {
  --paper: #f4f5f8;
  --card: #ffffff;
  --ink: #1a2030;
  --muted: #5b6377;
  --line: #dde1ea;
  --sheet: #c8385d;        /* answer-sheet "dropout" ink */
  --sheet-soft: #fbe9ee;
  --graphite: #262a33;     /* pencil fill */
  --ok: #1d7f55;
  --ok-soft: #e3f4ec;
  --bad: #b8590a;
  --bad-soft: #fcefe1;
  --blank: #fff3c4;
  --f-display: "IBM Plex Sans Condensed", "Noto Sans TC", system-ui, sans-serif;
  --f-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Noto Serif TC", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11141b; --card: #191d26; --ink: #e8eaf0; --muted: #9ba2b4; --line: #2b3140;
  --sheet: #f07a97; --sheet-soft: #3a1f29; --graphite: #e8eaf0;
  --ok: #4fc58f; --ok-soft: #173327; --bad: #f2a457; --bad-soft: #3a2a17; --blank: #4a3f15;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11141b; --card: #191d26; --ink: #e8eaf0; --muted: #9ba2b4; --line: #2b3140;
  --sheet: #f07a97; --sheet-soft: #3a1f29; --graphite: #e8eaf0;
  --ok: #4fc58f; --ok-soft: #173327; --bad: #f2a457; --bad-soft: #3a2a17; --blank: #4a3f15;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--sheet); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4vw, 34px); line-height: 1.1; letter-spacing: .01em; text-wrap: balance; }
.brand h1 b { color: var(--sheet); font-family: var(--f-mono); font-weight: 600; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat .v { font-family: var(--f-mono); font-size: 22px; font-weight: 600; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

/* answer sheet strip */
.sheet { background: var(--card); border: 1.5px solid var(--sheet); border-radius: 6px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.sheet-head .day { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.sheet-head .topic { color: var(--muted); font-size: 13px; }
.sheet-head .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sheet); }
.cells { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.grp { display: flex; flex-direction: column; gap: 4px; }
.grp .gl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--sheet); text-transform: uppercase; border-bottom: 1px solid var(--sheet); padding-bottom: 2px; }
.grp .row { display: flex; gap: 6px; }
.cell { width: 38px; height: 46px; border: 1px solid var(--line); border-radius: 4px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cell .dot { width: 14px; height: 18px; border-radius: 50%; border: 1.5px solid var(--sheet); }
.cell.ok .dot { background: var(--ok); border-color: var(--ok); }
.cell.bad .dot { background: var(--bad); border-color: var(--bad); }
.cell.cur { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }
.cell.res { width: auto; padding: 0 12px; font-family: var(--f-ui); font-size: 13px; flex-direction: row; gap: 6px; color: var(--ink); }

/* question card */
.q { background: var(--card); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: 1fr; }
.q.split { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.q > div { min-width: 0; padding: 22px 24px; }
.q.split .passage { border-right: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 55%, var(--card)); }
@media (max-width: 760px) { .q.split { grid-template-columns: 1fr; } .q.split .passage { border-right: 0; border-bottom: 1px solid var(--line); } .q > div { padding: 18px 16px; } }
.passage h3 { margin: 0 0 10px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.passage .text { font-family: var(--f-read); font-size: 16px; line-height: 1.65; max-width: 62ch; }
.passage .text p { margin: 0 0 .8em; }
.passage .doc-title { font-weight: 600; }
.blank { display: inline-block; min-width: 3.4em; text-align: center; border-bottom: 2px solid var(--muted); font-family: var(--f-mono); font-size: 13px; padding: 0 4px; color: var(--muted); }
.blank.on { background: var(--blank); border-color: var(--ink); color: var(--ink); }
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.num { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--sheet); }
.part { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sheet-soft); color: var(--sheet); font-weight: 500; }
.stem { font-family: var(--f-read); font-size: 18px; line-height: 1.55; margin: 0 0 16px; max-width: 62ch; }
.stem .gap { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 12px; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-family: var(--f-read); font-size: 16px; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.bub { flex: none; width: 26px; height: 30px; border-radius: 50%; border: 1.5px solid var(--sheet); color: var(--sheet); display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 13px; font-weight: 600; margin-top: -3px; }
.opt.pick .bub { background: var(--graphite); border-color: var(--graphite); color: var(--card); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .bub { border-color: var(--ok); color: var(--ok); }
.opt.right.pick .bub { background: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong.pick .bub { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt .ot { min-width: 0; }

.listen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.play { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--card); border: 0; border-radius: 99px; padding: 9px 18px; font-weight: 500; }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.listen label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.listen select { font: inherit; font-size: 13px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.script { font-family: var(--f-read); font-size: 15px; background: var(--paper); border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; }

.fb { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.fb .ex { margin: 0; max-width: 64ch; }
.vocab { display: flex; flex-wrap: wrap; gap: 6px; }
.vocab span { font-size: 13px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
.vocab b { font-family: var(--f-read); font-weight: 600; margin-right: 4px; }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; font-size: 14px; }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.keys { font-size: 12px; color: var(--muted); margin-top: 10px; }
.keys kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

/* results */
.res-top { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin-bottom: 18px; }
.score { font-family: var(--f-mono); font-size: 56px; font-weight: 600; line-height: 1; }
.score small { font-size: 22px; color: var(--muted); }
.goal { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
.bar { position: relative; height: 10px; background: var(--line); border-radius: 99px; overflow: visible; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--ink); }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--sheet); }
.goal .cap { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.pt { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.pt .n { font-family: var(--f-mono); font-size: 18px; font-weight: 600; }
.pt .l { font-size: 12px; color: var(--muted); }
.wrongs { display: flex; flex-direction: column; gap: 6px; }
.wrongs button { text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; display: flex; gap: 10px; }
.wrongs .num { flex: none; }
.ghost-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* archive */
.arch h2 { font-family: var(--f-display); font-size: 18px; margin: 0 0 10px; }
.arch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ad { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.ad.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.ad .d { font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.ad .s { font-size: 12px; color: var(--muted); }
.ad .s.ok { color: var(--ok); } .ad .s.bad { color: var(--bad); }

.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 6px; padding: 32px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.note { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .opt, .cell, .ad { transition: border-color .15s, background-color .15s; } }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.install { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 14px; }
.install img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
.install .txt { flex: 1; min-width: 180px; }
.install .txt b { display: block; }
.install .txt span { color: var(--muted); font-size: 13px; }
.install .x { background: transparent; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>多益 <b>750</b> 每日十題</h1>
      <p>內建 30 回題庫，每天自動換 10 題：聽力 Part 2、閱讀 Part 5・6・7</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="install" id="install" hidden>
    <img src="icon-192.png" alt="">
    <div class="txt"><b>加到手機主畫面</b><span id="installHow"></span></div>
    <button class="btn primary" id="installBtn" hidden>安裝</button>
    <button class="x" id="installX" aria-label="關閉提示">×</button>
  </div>
  <main id="app" style="display:flex;flex-direction:column;gap:20px">
    <div class="empty" id="boot"><strong>正在載入今日題目…</strong></div>
  </main>
  <section class="arch" id="arch" hidden>
    <h2>題目存檔</h2>
    <div class="arch-list" id="archList"></div>
  </section>
  <p class="note" id="syncNote"></p>
</div>

<script>
(() => {
  const PART_NAME = { P2: "Part 2 應答問題", P5: "Part 5 句子填空", P6: "Part 6 段落填空", P7: "Part 7 閱讀理解" };
  const PART_SHORT = { P2: "聽力 P2", P5: "P5 單句", P6: "P6 段落", P7: "P7 閱讀" };
  const LETTERS = "ABCD";
  const LS_KEY = "toeic750-progress-v1";
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());

  const S = { days: [], sel: null, idx: 0, progress: { days: {} }, dbState: "loading", rate: 0.9 };
  let progRef = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDay = (d) => {
    const [y, m, dd] = d.split("-").map(Number);
    const w = "日一二三四五六"[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()];
    return `${m}月${dd}日 週${w}`;
  };

  // ---------- progress ----------
  try { const raw = localStorage.getItem(LS_KEY); if (raw) S.progress = JSON.parse(raw) || { days: {} }; } catch (e) {}
  if (!S.progress.days) S.progress.days = {};
  let writing = false, again = false;
  async function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S.progress)); } catch (e) {}
    if (!progRef) return;
    if (writing) { again = true; return; }
    writing = true;
    try { await progRef.set(JSON.parse(JSON.stringify(S.progress))); }
    catch (e) { console.warn("progress save failed", e); }
    writing = false;
    if (again) { again = false; save(); }
  }
  const dayProg = (date, n) => {
    let p = S.progress.days[date];
    if (!p || !Array.isArray(p.a)) { p = S.progress.days[date] = { a: Array(n).fill(null), done: false }; }
    while (p.a.length < n) p.a.push(null);
    return p;
  };
  const scoreOf = (day) => {
    const p = S.progress.days[day.date]; if (!p) return null;
    let c = 0, answered = 0;
    day.questions.forEach((q, i) => { if (p.a[i] != null) { answered++; if (p.a[i] === q.answer) c++; } });
    return { c, answered, total: day.questions.length, done: answered === day.questions.length };
  };

  // ---------- speech ----------
  const synth = window.speechSynthesis;
  let voices = [];
  // macOS ships novelty / robotic voices (Albert, Bad News, Zarvox, Eloquence voices...) that sound broken. Exclude them.
  const BAD = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Kathy|Organ|Princess|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Grandma|Grandpa|Rocko|Sandy|Shelley|Eddy|Flo|Reed|Vicki|Victoria|Bruce|Agnes)\b/i;
  const GOOD = ["Samantha", "Ava", "Allison", "Susan", "Tom", "Alex", "Nathan", "Evan", "Zoe", "Joelle", "Noelle", "Aria", "Jenny", "Guy", "Daniel", "Serena", "Karen", "Moira", "Libby", "Ryan", "Sonia", "Lee"];
  const rank = (v) => {
    let s = 0;
    if (/premium/i.test(v.name)) s += 50;
    if (/enhanced/i.test(v.name)) s += 40;
    if (/natural|neural|online/i.test(v.name)) s += 35;
    if (/^Google/i.test(v.name)) s += 25;
    const g = GOOD.findIndex((n) => v.name.includes(n));
    if (g >= 0) s += 20 - g * 0.1;
    if (/en[-_]US/i.test(v.lang)) s += 3;
    return s;
  };
  const loadVoices = () => {
    try {
      voices = synth.getVoices()
        .filter((v) => /^en[-_](US|GB|AU|CA|IE|NZ)/i.test(v.lang) && !BAD.test(v.name))
        .sort((a, b) => rank(b) - rank(a));
    } catch (e) { voices = []; }
    const sel = document.getElementById("voice");
    if (sel && sel.options.length !== voices.length) render();
  };
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  try { S.voice = localStorage.getItem("toeic750-voice") || ""; } catch (e) { S.voice = ""; }
  const pickVoice = () => voices.find((v) => v.name === S.voice) || voices[0] || null;
  let speakToken = 0;
  function speak(q) {
    if (!synth) return;
    synth.cancel();
    const token = ++speakToken;
    const v = pickVoice();
    const lines = [q.prompt, ...q.options.map((o, i) => `${LETTERS[i]}. ${o}`)];
    const next = (i) => {
      if (token !== speakToken || i >= lines.length) return;
      const u = new SpeechSynthesisUtterance(lines[i]);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
      u.rate = S.rate; u.pitch = 1;
      u.onend = () => setTimeout(() => next(i + 1), i === 0 ? 900 : 600);
      synth.speak(u);
    };
    next(0);
  }

  // ---------- render ----------
  function renderStats() {
    const doneDays = Object.keys(S.progress.days).filter((d) => { const day = S.days.find((x) => x.date === d); const s = day && scoreOf(day); return s && s.done; });
    let streak = 0;
    const set = new Set(doneDays);
    let cur = set.has(today) ? today : prevDay(today);
    while (set.has(cur)) { streak++; cur = prevDay(cur); }
    let c = 0, t = 0;
    S.days.forEach((d) => { const s = scoreOf(d); if (s) { c += s.c; t += s.answered; } });
    const acc = t ? Math.round((c / t) * 100) + "%" : "—";
    $("stats").innerHTML = `
      <div class="stat"><span class="v">${streak}</span><span class="k">連續天數</span></div>
      <div class="stat"><span class="v">${doneDays.length}</span><span class="k">完成天數</span></div>
      <div class="stat"><span class="v">${acc}</span><span class="k">累計正確率</span></div>`;
  }
  function prevDay(d) { const [y, m, dd] = d.split("-").map(Number); const x = new Date(Date.UTC(y, m - 1, dd - 1)); return x.toISOString().slice(0, 10); }

  function render() {
    renderStats();
    renderArchive();
    const app = $("app");
    if (!S.days.length) {
      const msg = S.dbState === "off"
        ? `<strong>無法連到題庫</strong>請在 claude.ai 登入後開啟這個網頁，題目才會載入。`
        : S.dbState === "loading" ? `<strong>正在載入今日題目…</strong>`
        : `<strong>題庫目前是空的</strong>第一批題目會在明天清晨自動送達。`;
      app.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }
    const day = S.days.find((d) => d.date === S.sel) || S.days[0];
    S.sel = day.date;
    const n = day.questions.length;
    const p = dayProg(day.date, n);
    const isToday = day.date === today;
    const latestNote = !isToday && S.days[0].date === day.date && !S.days.some((d) => d.date === today)
      ? `<span class="topic">今日題目尚未送達，先顯示最近一回</span>` : "";

    // sheet
    const groups = [];
    day.questions.forEach((q, i) => { const g = groups[groups.length - 1]; if (g && g.part === q.part) g.items.push(i); else groups.push({ part: q.part, items: [i] }); });
    const sc = scoreOf(day);
    const sheet = `
      <section class="sheet" aria-label="答案卡">
        <div class="sheet-head">
          <div><span class="lbl">Answer sheet</span> <span class="day">${fmtDay(day.date)}${isToday ? "・今天" : ""}</span></div>
          <div class="topic">${esc(day.topic || "")}${day.round ? ` · 第 ${day.round} 回` : ""} ${latestNote}</div>
        </div>
        <div class="cells">
          ${groups.map((g) => `<div class="grp"><span class="gl">${PART_SHORT[g.part] || g.part}</span><div class="row">${g.items.map((i) => {
            const a = p.a[i]; const st = a == null ? "" : a === day.questions[i].answer ? "ok" : "bad";
            return `<button class="cell ${st} ${S.idx === i ? "cur" : ""}" data-go="${i}" aria-label="第 ${i + 1} 題"><span>${i + 1}</span><span class="dot"></span></button>`;
          }).join("")}</div></div>`).join("")}
          <div class="grp"><span class="gl">結果</span><div class="row"><button class="cell res ${S.idx === n ? "cur" : ""}" data-go="${n}">${sc && sc.answered ? `${sc.c}/${sc.answered}` : "成績"}</button></div></div>
        </div>
      </section>`;

    const body = S.idx >= n ? renderResults(day, p) : renderQuestion(day, p, S.idx);
    app.innerHTML = sheet + body;
    app.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { S.idx = +b.dataset.go; speakToken++; synth && synth.cancel(); render(); });
    app.querySelectorAll("[data-opt]").forEach((b) => b.onclick = () => choose(+b.dataset.opt));
    const play = app.querySelector("[data-play]"); if (play) play.onclick = () => speak(day.questions[S.idx]);
    const rate = app.querySelector("#rate"); if (rate) rate.onchange = () => { S.rate = +rate.value; try { localStorage.setItem("toeic750-rate", rate.value); } catch (e) {} };
    const vsel = app.querySelector("#voice"); if (vsel) vsel.onchange = () => { S.voice = vsel.value; try { localStorage.setItem("toeic750-voice", vsel.value); } catch (e) {} speak(day.questions[S.idx]); };
    const reset = app.querySelector("[data-reset]"); if (reset) reset.onclick = () => {
      if (reset.dataset.armed) { S.progress.days[day.date] = { a: Array(n).fill(null), done: false }; S.idx = 0; save(); render(); }
      else { reset.dataset.armed = "1"; reset.textContent = "再按一次確認清除"; }
    };
  }

  function renderPassage(day, q) {
    const ps = day.passages && day.passages[q.group];
    if (!ps) return "";
    const num = S.idx + 1;
    const html = esc(ps.text).split(/\n{2,}/).map((para) => `<p>${para.replace(/\n/g, "<br>")}</p>`).join("")
      .replace(/\[(\d+)\]/g, (_, k) => `<span class="blank ${+k === num ? "on" : ""}">(${k})</span>`);
    return `<div class="passage"><h3>${esc(ps.kind || "Passage")}</h3>${ps.title ? `<div class="text"><p class="doc-title">${esc(ps.title)}</p></div>` : ""}<div class="text">${html}</div></div>`;
  }

  function renderQuestion(day, p, i) {
    const q = day.questions[i];
    const a = p.a[i];
    const answered = a != null;
    const listening = q.part === "P2";
    const passage = renderPassage(day, q);
    let stem = "";
    if (listening) {
      stem = `
        <div class="listen">
          <button class="play" data-play><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>${synth ? "播放題目" : "此瀏覽器不支援語音"}</button>
          <label for="rate">語速 <select id="rate">${[0.8, 0.9, 1, 1.1].map((r) => `<option value="${r}" ${r === S.rate ? "selected" : ""}>${r}×</option>`).join("")}</select></label>
          ${voices.length ? `<label for="voice">聲音 <select id="voice">${voices.map((v) => `<option value="${esc(v.name)}" ${pickVoice() === v ? "selected" : ""}>${esc(v.name.replace(/\s*\(.*\)$/, ""))} · ${esc(v.lang)}</option>`).join("")}</select></label>` : ""}
        </div>
        ${synth && !voices.some((v) => rank(v) >= 20) ? `<p class="hint">這台裝置沒有找到高品質英文語音。Mac 可到「系統設定 → 輔助使用 → 朗讀內容 → 系統聲音 → 管理聲音」下載 English (US) 的 Ava 或 Samantha（Premium／加強版），重新整理後就會出現在「聲音」選單。</p>` : ""}
        <p class="hint">聽一句問句與三個回應，選出最適當的回應。作答後會顯示原文。</p>
        ${answered || !synth ? `<div class="script"><b>Q:</b> ${esc(q.prompt)}</div>` : ""}`;
    } else if (q.stem) {
      stem = `<p class="stem">${esc(q.stem).replace(/_{3,}/g, '<span class="gap"></span>')}</p>`;
    }
    const opts = q.options.map((o, k) => {
      let cls = "opt";
      if (answered) { if (k === a) cls += " pick"; if (k === q.answer) cls += " right"; else if (k === a) cls += " wrong"; }
      const text = listening && !answered && synth ? "" : esc(o);
      return `<button class="${cls}" data-opt="${k}" ${answered ? "disabled" : ""}><span class="bub">${LETTERS[k]}</span><span class="ot">${text}</span></button>`;
    }).join("");
    const fb = answered ? `
      <div class="fb">
        <div class="verdict ${a === q.answer ? "ok" : "bad"}">${a === q.answer ? "答對了" : `答錯了，正解是 (${LETTERS[q.answer]})`}</div>
        <p class="ex">${esc(q.explanation)}</p>
        ${q.vocab && q.vocab.length ? `<div class="vocab">${q.vocab.map((v) => `<span><b>${esc(v[0])}</b>${esc(v[1])}</span>`).join("")}</div>` : ""}
      </div>` : "";
    const n = day.questions.length;
    return `
      <article class="q ${passage ? "split" : ""}">
        ${passage}
        <div>
          <div class="qmeta"><span class="num">Q${String(i + 1).padStart(2, "0")}</span><span class="part">${PART_NAME[q.part] || q.part}</span></div>
          ${stem}
          <div class="opts" role="group" aria-label="選項">${opts}</div>
          ${fb}
          <div class="nav">
            <button class="btn" data-go="${i - 1}" ${i === 0 ? "disabled" : ""}>上一題</button>
            <button class="btn ${answered ? "primary" : ""}" data-go="${i + 1}">${i === n - 1 ? "看成績" : "下一題"}</button>
          </div>
          <div class="keys">鍵盤：<kbd>A</kbd>–<kbd>D</kbd> 作答，<kbd>←</kbd><kbd>→</kbd> 換題${listening ? "，<kbd>P</kbd> 播放" : ""}</div>
        </div>
      </article>`;
  }

  function renderResults(day, p) {
    const sc = scoreOf(day);
    const n = day.questions.length;
    if (!sc.answered) return `<div class="empty"><strong>還沒有作答</strong>點答案卡上的題號開始作答。</div>`;
    const pct = Math.round((sc.c / n) * 100);
    const byPart = {};
    day.questions.forEach((q, i) => { const b = byPart[q.part] || (byPart[q.part] = { c: 0, t: 0 }); b.t++; if (p.a[i] === q.answer) b.c++; });
    const wrong = day.questions.map((q, i) => ({ q, i })).filter(({ q, i }) => p.a[i] != null && p.a[i] !== q.answer);
    const verdict = !sc.done ? `還有 ${n - sc.answered} 題未作答` : sc.c >= 8 ? "達到 750 分水準的穩定區間" : sc.c >= 7 ? "接近 750，複習錯題就能穩住" : "先把錯題的文法點弄熟，明天再挑戰";
    return `
      <article class="q"><div>
        <div class="res-top">
          <div class="score">${sc.c}<small>/${n}</small></div>
          <div class="goal">
            <div class="bar" role="img" aria-label="正確率 ${pct}%，目標 80%"><i style="width:${pct}%"></i><span class="mark" style="left:80%"></span></div>
            <div class="cap"><span>正確率 ${pct}%</span><span>750 目標線 80%</span></div>
            <div><b>${verdict}</b></div>
          </div>
        </div>
        <div class="parts">${Object.entries(byPart).map(([k, v]) => `<div class="pt"><div class="n">${v.c}/${v.t}</div><div class="l">${PART_NAME[k] || k}</div></div>`).join("")}</div>
        ${wrong.length ? `<h3 style="margin:0 0 6px;font-size:15px">錯題回顧</h3><div class="wrongs">${wrong.map(({ q, i }) => `<button data-go="${i}"><span class="num">Q${String(i + 1).padStart(2, "0")}</span><span>${esc(q.stem || q.prompt).slice(0, 90)}</span></button>`).join("")}</div>` : `<p>全對，今天的題目完全掌握。</p>`}
        <div class="ghost-row"><button class="btn" data-go="0">從第 1 題檢視</button><button class="btn" data-reset>清除本回作答重做</button></div>
      </div></article>`;
  }

  function renderArchive() {
    if (S.days.length < 1) { $("arch").hidden = true; return; }
    $("arch").hidden = false;
    $("archList").innerHTML = S.days.map((d) => {
      const s = scoreOf(d);
      const st = !s || !s.answered ? `<span class="s">未作答</span>` : !s.done ? `<span class="s">進行中 ${s.answered}/${s.total}</span>` : `<span class="s ${s.c >= 8 ? "ok" : "bad"}">${s.c}/${s.total} 題正確</span>`;
      return `<button class="ad ${d.date === S.sel ? "sel" : ""}" data-day="${d.date}"><span class="d">${fmtDay(d.date)}${d.date === today ? "・今天" : ""}</span>${st}</button>`;
    }).join("");
    $("archList").querySelectorAll("[data-day]").forEach((b) => b.onclick = () => {
      S.sel = b.dataset.day; const day = S.days.find((x) => x.date === S.sel);
      const p = dayProg(day.date, day.questions.length);
      const first = p.a.findIndex((x) => x == null); S.idx = first === -1 ? day.questions.length : first;
      synth && synth.cancel(); render(); window.scrollTo({ top: 0 });
    });
  }

  function choose(k) {
    const day = S.days.find((d) => d.date === S.sel); if (!day || S.idx >= day.questions.length) return;
    const p = dayProg(day.date, day.questions.length);
    if (p.a[S.idx] != null) return;
    p.a[S.idx] = k;
    const s = scoreOf(day); p.done = s.done; if (s.done) { p.score = s.c; p.finishedAt = new Date().toISOString(); }
    save(); render();
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("select, input, textarea")) return;
    const day = S.days.find((d) => d.date === S.sel); if (!day) return;
    const key = e.key.toUpperCase();
    const q = day.questions[S.idx];
    if (q && LETTERS.slice(0, q.options.length).includes(key) && key.length === 1) { choose(LETTERS.indexOf(key)); }
    else if (key === "P" && q && q.part === "P2") speak(q);
    else if (e.key === "ArrowRight" && S.idx < day.questions.length) { S.idx++; synth && synth.cancel(); render(); }
    else if (e.key === "ArrowLeft" && S.idx > 0) { S.idx--; synth && synth.cancel(); render(); }
  });

  try { const r = parseFloat(localStorage.getItem("toeic750-rate")); if (r) S.rate = r; } catch (e) {}

  function pickInitial() {
    if (S.sel && S.days.some((d) => d.date === S.sel)) return;
    const day = S.days.find((d) => d.date === today) || S.days[0];
    if (!day) return;
    S.sel = day.date;
    const p = dayProg(day.date, day.questions.length);
    const first = p.a.findIndex((x) => x == null); S.idx = first === -1 ? day.questions.length : first;
  }

  render();

 outstanding sales performance last year.","vocab":[["promote","升職"],["regional manager","區域經理"],["outstanding","傑出的"]]},{"answer":1,"explanation":"前文在說明停車場關閉期間的替代停車安排，(B) 補充需要無障礙停車的人該怎麼做，與上下文主題一致。(A) 是無關的背景，(C)(D) 與停車無關。","group":"g6","options":["The garage was built more than twenty years ago.","Employees who need accessible parking should contact the front desk to reserve a space near the building.","The cafeteria will also offer a new lunch menu next week.","Please submit your timesheets by Friday."],"part":"P6","stem":"Choose the sentence that best fits blank (7).","vocab":[["accessible parking","無障礙停車位"],["reserve","預留"],["overflow lot","備用停車場"]]},{"answer":2,"explanation":"appreciate your ______ 中，所有格 your 後面需要名詞，cooperation（合作、配合）是名詞。公告結尾常見句：We appreciate your cooperation / patience / understanding.","group":"g6","options":["cooperate","cooperative","cooperation","cooperatively"],"part":"P6","stem":"Choose the word that best fits blank (8).","vocab":[["resurfacing","重鋪路面"],["inconvenience","不便"],["cooperation","配合"]]},{"answer":3,"explanation":"廣告開頭 Planning a corporate event? 並介紹會議室與方案，目的是推銷活動場地。主旨題通常看第一段就能判斷。","group":"g7","options":["To announce a hotel renovation","To recruit event staff","To describe a new restaurant","To promote event facilities"],"part":"P7","stem":"What is the purpose of the advertisement?","vocab":[["corporate event","公司活動"],["accommodate","容納"],["complimentary","免費的"]]},{"answer":1,"explanation":"第二段寫 Groups booking more than 30 guest rooms receive a 15% discount on meeting room fees。(A) 是陷阱：12 月 1 日前預訂得到的是免費歡迎酒會，不是折扣。","group":"g7","options":["By booking before December 1","By reserving more than 30 guest rooms","By contacting the events team by e-mail","By hosting fewer than 20 guests"],"part":"P7","stem":"How can a group receive a discount on meeting room fees?","vocab":[["discount","折扣"],["welcome reception","歡迎酒會"],["quote","報價"]]}]},{"topic":"主題：出差與差旅安排","passages":{"g6":{"kind":"E-mail","text":"Dear Ms. Raman,\n\nYour travel arrangements for the Asia Retail Expo in Singapore have been confirmed. You will depart on Flight SQ 877 at 9:40 A.M. on Monday, November 16, and return on Friday, November 20. A detailed itinerary is attached to this e-mail.\n\nYour room at the Marina Crest Hotel has been reserved for four nights. Please note that the hotel offers a free shuttle service to the exhibition hall, so you will not need to arrange [7] transportation. [8]\n\nIf you have any questions, feel free to contact me at extension 412.\n\nBest regards,\nMarcus Webb","title":"To: Priya Raman / From: Marcus Webb, Corporate Travel Desk / Subject: Your itinerary for the Singapore trade fair"},"g7":{"kind":"Text message","text":"Hi Tom, my connecting flight from Frankfurt has been delayed because of a mechanical problem, so I won't land in Toronto until around 11:30 tonight. That means I'll miss the client dinner with Hartwell Logistics. Could you apologize to Mr. Hartwell on my behalf and let him know I'm still planning to attend tomorrow's 9:00 A.M. meeting?\n\nAlso, I was supposed to bring the printed sample contracts, but they're in my checked luggage. Would you mind printing three copies from the shared drive before the meeting? The file is called \"Hartwell_Draft_v3.\" I'll call you once I've landed. Thanks so much!","title":"Julia Moreno to Tom Fischer (4:52 P.M.)"}},"questions":[{"answer":2,"explanation":"這是 A or B 選擇疑問句，不能用 Yes/No 回答，所以 (A) 是陷阱；(B) 重複 flight 一字但答非所問。(C)「哪個靠前面都可以」是選擇疑問句常見的「都可以」型正解。","options":["Yes, I'd prefer that.","The flight was delayed for an hour.","Whichever is closer to the front."],"part":"P2","prompt":"Would you prefer a window seat or an aisle seat on the flight?","vocab":[["aisle seat","靠走道座位"],["window seat","靠窗座位"],["whichever","無論哪一個"]]},{"answer":0,"explanation":"陳述句題型，要找能接續對話的回應：(A) 提出替代方案最自然。(B) 用 booked/book 同字異義陷阱，(C) 重複 convention 但沒有回應「客滿」的問題。","options":["Then let's look for one a few stations away.","Yes, I've read that book.","The convention lasts three days."],"part":"P2","prompt":"The hotel near the convention center is already fully booked.","vocab":[["fully booked","客滿；全被預訂"],["convention center","會議展覽中心"]]},{"answer":3,"explanation":"空格後接名詞 luggage，且表示「旅客的行李」的所有關係，須用所有格關係代名詞 whose。who/whom 後面不直接接名詞當所有格，which 指物不指人。","options":["who","which","whom","whose"],"part":"P5","stem":"Travelers ______ luggage exceeds the weight limit will be charged an additional fee.","vocab":[["exceed","超過"],["weight limit","重量限制"],["additional fee","額外費用"]]},{"answer":1,"explanation":"By the time + 現在式（表未來）時，主要子句用未來完成式，表示「到那時之前已完成」。(C) 是被動語態，但主詞 sales team 是準備的人，應用主動；(D) 過去進行式時間不符。","options":["prepares","will have prepared","has been prepared","was preparing"],"part":"P5","stem":"By the time Mr. Okafor arrives in Seoul, the sales team ______ the venue for the product demonstration.","vocab":[["by the time","到…的時候"],["venue","場地"],["demonstration","展示；示範"]]},{"answer":2,"explanation":"考易混淆字彙與搭配詞 be reimbursed for（獲得…的費用報銷），配合「繳交收據」的條件語意最合理。charged 是「被收費」，與報帳情境相反；deducted 與 invested 不能接 for + 費用表示報銷。","options":["deducted","charged","reimbursed","invested"],"part":"P5","stem":"Employees will be ______ for meals and taxi fares incurred during approved business trips, provided they submit receipts within 30 days.","vocab":[["reimburse","報銷；償還"],["incur","產生（費用）"],["provided (that)","只要；倘若"]]},{"answer":0,"explanation":"Should you need... 是 If you should need... 省略 if 的倒裝條件句，商務書信常見。Unless（除非）語意矛盾，Whereas 表對比，Despite 是介系詞不能接子句。","options":["Should","Unless","Whereas","Despite"],"part":"P5","stem":"______ you need to change your travel dates, please notify the travel desk at least 48 hours in advance.","vocab":[["notify","通知"],["in advance","事先"],["travel desk","差旅服務台"]]},{"answer":2,"explanation":"空格在動詞 arrange 與名詞 transportation 之間，需要形容詞修飾名詞，故選 additional（額外的）。addition 是名詞、additionally 是副詞、add 是動詞，都不能修飾名詞。","group":"g6","options":["addition","additionally","additional","add"],"part":"P6","stem":"Choose the word that best fits blank (7).","vocab":[["itinerary","行程表"],["shuttle service","接駁服務"],["exhibition hall","展覽館"]]},{"answer":1,"explanation":"前一句提到飯店提供免費接駁車，(B) 說明搭乘時出示房卡即可，自然延續接駁車話題。其他選項分別談辦公室休假、求職申請與明年航班，都與上下文無關。","group":"g6","options":["Our office will be closed during the national holiday.","Simply show your room key to the driver when boarding.","Thank you for submitting your application on time.","The new flight schedule will take effect next spring."],"part":"P6","stem":"Choose the sentence that best fits blank (8).","vocab":[["board","登上（交通工具）"],["take effect","生效"]]},{"answer":3,"explanation":"訊息開頭說轉機航班延誤，因此會錯過客戶晚餐，目的在說明無法出席活動並請同事代為致歉。她仍會參加明早會議，所以 (A) 錯；行李只是放在托運行李中，並未遺失，(C) 是陷阱。","group":"g7","options":["To reschedule a morning meeting","To ask Mr. Fischer to pick her up at the airport","To report that her luggage was lost","To explain why she cannot attend an event"],"part":"P7","stem":"Why did Ms. Moreno send the message?","vocab":[["connecting flight","轉機航班"],["mechanical problem","機械故障"],["on one's behalf","代表某人"]]},{"answer":0,"explanation":"她請 Tom 從共用雲端硬碟印出三份合約樣本，(A)「準備一些文件的副本」是同義改寫。她沒有要求取消晚餐或改訂航班；檔案是讓 Tom 列印，而非寄給她，(D) 是細節陷阱。","group":"g7","options":["Prepare copies of some documents","Book her a later flight","Cancel the dinner with a client","Send her a file by e-mail"],"part":"P7","stem":"What does Ms. Moreno ask Mr. Fischer to do?","vocab":[["checked luggage","托運行李"],["shared drive","共用雲端硬碟"],["sample contract","合約範本"]]}]},{"topic":"主題：人資與招聘","passages":{"g6":{"kind":"E-mail","text":"Dear Mr. Haddad,\n\nOn behalf of Norland Pharmaceuticals, I am pleased to offer you the position of Quality Assurance Analyst at our Brookfield facility. As discussed during your final interview, your starting annual salary will be $68,000. You will become eligible for our full benefits package once you [7] a 90-day probationary period.\n\nYour first day of employment is scheduled for Monday, November 30. [8] During that week, you will also meet with your supervisor, Dr. Ellen Fry, to review your training plan.\n\nTo accept this offer, please sign the enclosed agreement and return it to me by November 13. If you have any questions, feel free to contact me directly at 555-0148.\n\nSincerely,\nRachel Ong\nHuman Resources Manager","title":"To: Samir Haddad / From: Rachel Ong, Norland Pharmaceuticals / Subject: Offer of employment"},"g7":{"kind":"Notice","text":"Know someone who would be a great fit at Calloway Logistics? Through our updated Employee Referral Program, current staff members can now earn a bonus of $1,500 for each successful referral, up from $1,000 last year. To qualify, the referred candidate must be hired for a full-time position and remain with the company for at least six months. Referrals for part-time or temporary roles are not eligible.\n\nTo submit a referral, log in to the HR portal and complete the referral form, attaching the candidate's résumé. Please note that managers may not receive bonuses for referring candidates to their own departments. For a complete list of open positions, visit the Careers page or contact Simon Barrett in Human Resources at extension 2207.","title":"Calloway Logistics: Updated Employee Referral Program"}},"questions":[{"answer":1,"explanation":"How many 問的是「數量」，只有 B 回答了人數（三位，從近六十人中選出）。A 用 Yes 回答 Wh- 問句且重複 made it；C 重複 final round 屬於同字陷阱，答非所問。","options":["Yes, they made it on time.","Only three, out of nearly sixty.","The final round was held online."],"part":"P2","prompt":"How many applicants made it to the final round?","vocab":[["applicant","應徵者"],["make it to","進入；晉級到"],["final round","最後一輪（面試）"]]},{"answer":2,"explanation":"否定問句確認「新進人員是否週一報到」，C 以 Actually 修正資訊（延後一週），是多益常見的間接回答。A 的 Higher 與 hire 為相似音陷阱；B 重複 start 但談的是會議，答非所問。","options":["Higher salaries, I believe.","We usually start the meeting at nine.","Actually, her start date was pushed back a week."],"part":"P2","prompt":"Isn't the new hire supposed to start on Monday?","vocab":[["new hire","新進員工"],["be supposed to","應該；預定要"],["push back","延後"]]},{"answer":0,"explanation":"so far 提示現在完成式，且主詞 applications 是「被接收」的一方，需用被動語態 have been received。have received 與 are receiving 為主動，語意變成申請書去接收東西；received 為過去式，與 so far 不合。","options":["have been received","have received","are receiving","received"],"part":"P5","stem":"Over 200 applications ______ for the marketing coordinator position so far.","vocab":[["application","申請（書）"],["coordinator","專員；協調人"],["so far","到目前為止"]]},{"answer":3,"explanation":"句中有 or，對應的相關連接詞為 either A or B（兩者之一）。both 須搭配 and，neither 須搭配 nor；whether A or B 用來引導名詞子句或副詞子句，不能放在 have 的受詞前。","options":["both","neither","whether","either"],"part":"P5","stem":"Candidates must have ______ a bachelor's degree in finance or at least five years of relevant experience.","vocab":[["candidate","候選人；求職者"],["bachelor's degree","學士學位"],["relevant experience","相關經驗"]]},{"answer":2,"explanation":"考搭配詞：meet the requirements（符合條件）是固定用法，同類還有 meet a deadline、meet the needs。reach 常搭配 a goal/an agreement；attend 是出席活動；join 是加入團體，皆不與 requirements 搭配。","options":["reach","attend","meet","join"],"part":"P5","stem":"Applicants who do not ______ the minimum requirements will not be contacted for an interview.","vocab":[["minimum requirements","最低資格條件"],["meet the requirements","符合要求"],["contact","聯絡"]]},{"answer":0,"explanation":"考情緒分詞形容詞：主詞是「人」（委員會）感到印象深刻，用過去分詞 impressed，且固定搭配 be impressed with/by。impressive 描述「令人印象深刻的事物」；impressing 不作此用法；impression 是名詞。","options":["impressed","impressive","impressing","impression"],"part":"P5","stem":"The hiring committee was ______ with the candidate's knowledge of international tax law.","vocab":[["hiring committee","招聘委員會"],["be impressed with","對……印象深刻"],["tax law","稅法"]]},{"answer":1,"explanation":"once 引導時間副詞子句，子句內以現在式或現在完成式代替未來式，have completed 強調「完成試用期之後」。will complete 是常見陷阱（時間子句不用 will）；completing 缺少動詞；had completed 為過去完成式，與未來情境不符。","group":"g6","options":["will complete","have completed","completing","had completed"],"part":"P6","stem":"Choose the word that best fits blank (7).","
